  - { id: platon-protagoras, druh: pramen, nazev: "Prótagorás", autor: Platón, dilo: "Protagoras, řecky J. Burnet, angl. W. R. M. Lamb (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg022/tlg0059.tlg022.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Hippokratés budí Sókrata (310a–311a), Prótagorás bydlí u Kallia (311a); Prótagorás v Kalliově domě (314e–315b); Sókratova námitka: o lodích odborníci, o obci každý (319b–d); velká řeč, mýtus o Prométheovi (320c–323a); pestrost dobra (334a–c)." }
