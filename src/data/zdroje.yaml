      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka"
    zdroj: aristoteles-metafyzika-ideje
  - id: kategorie-2b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Kategorie
    misto: 5, 2b5–6
    cesky: "Kdyby nebylo prvních podstat, nemohlo by být nic z ostatního."
    original: "μὴ οὐσῶν οὖν τῶν πρώτων οὐσιῶν ἀδύνατον τῶν ἄλλων τι εἶναι"
    preklad:
      druh: vlastni
      podle: "řecká věta z řecké Wikisource a anglický překlad E. M. Edghilla („if these last did not exist, it would be impossible for anything else to exist“); první podstata je tento člověk, tento kůň (2a11–14); řecké znění ověřeno 5. 10. 2026 ve vydání I. Bekkera z roku 1837 (First1KGreek), čísla řádků podle SEP „Aristotle's Categories“ (2a11, 2b6)"
    zdroj: aristoteles-kategorie
  - id: meteorologika-iii-4
    osoba: aristoteles
    autor: Aristotelés
    dilo: Meteorologika
    misto: III, 4
    cesky: "Je tedy zřejmé, že duha je odraz pohledu ke slunci. Proto také vždycky vzniká naproti němu."
    original: "Ὅτι μὲν οὖν ἀνάκλασις ἡ ἶρις τῆς ὄψεως πρὸς τὸν ἥλιόν ἐστι, φανερόν· διὸ καὶ ἐξ ἐναντίας ἀεὶ γίνεται"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bekker, vydání 1837) a anglický překlad E. W. Webstera („the rainbow is a reflection of sight to the sun“); Bekkerovo číslování v otevřeném vydání není, proto jen kniha a kapitola"
    zdroj: aristoteles-meteorologika
  - id: politika-1261b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: II, 3, 1261b33–34
    cesky: "O to, co je společné největšímu počtu lidí, se pečuje nejméně."
    original: "ἥκιστα γὰρ ἐπιμελείας τυγχάνει τὸ πλείστων κοινόν"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama"
    zdroj: aristoteles-politika-ii
  - id: parmenides-b8
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 9–10
    cesky: "A kdyby to začalo z ničeho, co by to přimělo vzniknout později, a ne dřív?"
    original: "τί δʼ ἄν μιν καὶ χρέος ὦρσεν ὕστερον ἢ πρόσθεν, τοῦ μηδενὸς ἀρξάμενον, φῦν;"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels–Kranz 28 B8, dochováno u Simplikia) a anglický překlad J. Burneta („if it came from nothing, what need could have made it arise later rather than sooner?“); v básni mluví bohyně"
    zdroj: parmenides-b8
  - id: dl-ix-72-demokritos
    osoba: demokritos
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 72
    cesky: "Chladné je podle zvyku, teplé je podle zvyku. Ve skutečnosti jsou atomy a prázdno."
    original: "νόμῳ ψυχρόν, νόμῳ θερμόν, ἐτεῇ δὲ ἄτομα καὶ κενόν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; delší znění téhož výroku je zlomek DK 68 B9 (SEP „Democritus“)"
    zdroj: dl-ix-34
  - id: antidosis-271
    osoba: isokrates
    autor: Isokratés
    dilo: Antidosis
    misto: "271"
    cesky: "Lidé nemají v povaze dosáhnout vědění, se kterým bychom věděli, co dělat a co říkat. Za moudré proto pokládám ty, kdo svým míněním většinou trefí to nejlepší."
    original: "ἐπειδὴ γὰρ οὐκ ἔνεστιν ἐν τῇ φύσει τῇ τῶν ἀνθρώπων ἐπιστήμην λαβεῖν ἣν ἔχοντες ἂν εἰδεῖμεν ὅ τι πρακτέον ἢ λεκτέον ἐστίν, ἐκ τῶν λοιπῶν σοφοὺς μὲν νομίζω τοὺς ταῖς δόξαις ἐπιτυγχάνειν ὡς ἐπὶ τὸ πολὺ τοῦ βελτίστου δυναμένους"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad G. Norlina; zkráceno o druhou půli věty (kdo je filozof)"
    zdroj: isokrates-antidosis
  - id: helena-5
    osoba: isokrates
    autor: Isokratés
    dilo: Helena
    misto: "5"
    cesky: "Je mnohem lepší mít rozumné mínění o užitečných věcech než přesné vědění o neužitečných."
    original: "πολὺ κρεῖττόν ἐστι περὶ τῶν χρησίμων ἐπιεικῶς δοξάζειν ἢ περὶ τῶν ἀχρήστων ἀκριβῶς ἐπίστασθαι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad L. Van Hooka („likely conjecture about useful things is far preferable to exact knowledge of the useless“)"
    zdroj: isokrates-helena
  - id: kd-34
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 34 (Diogenés Laertios X, 151)
    cesky: "Nespravedlnost není zlo sama o sobě. Zlem je strach z podezření, že člověk neunikne těm, kdo mají takové věci trestat."
    original: "ἡ ἀδικία οὐ καθʼ ἑαυτὴν κακόν, ἀλλʼ ἐν τῷ κατὰ τὴν ὑποψίαν φόβῳ, εἰ μὴ λήσει τοὺς ὑπὲρ τῶν τοιούτων ἐφεστηκότας κολαστάς"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-x-139
  # Celek 5 „Stačí vědět, co je správné?“ (docs/podklady/celek-5-staci-vedet.md). Vlastní převody z řeckého textu.
  # ἀρετή převádím jako „ctnost“, ἕξις jako „ustálený stav“, ἔθος jako „zvyk“, ἀκρασία jako „neovládnutí“ (ne „slabá vůle“),
  # φρόνιμος jako „rozumný člověk“. U Platónova Prótagory je osoba sokrates: věty říká Sókratés, napsal je Platón.
  - id: etika-1103a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 1, 1103a32–b2
    cesky: "Co máme dělat, až se to naučíme, to se učíme tím, že to děláme: stavěním se lidé stávají staviteli a hrou na kitharu kitharisty. Stejně tak se spravedlivým jednáním stáváme spravedlivými, uměřeným uměřenými a statečným statečnými."
    original: "ἃ γὰρ δεῖ μαθόντας ποιεῖν, ταῦτα ποιοῦντες μανθάνομεν, οἷον οἰκοδομοῦντες οἰκοδόμοι γίνονται καὶ κιθαρίζοντες κιθαρισταί· οὕτω δὴ καὶ τὰ μὲν δίκαια πράττοντες δίκαιοι γινόμεθα, τὰ δὲ σώφρονα σώφρονες, τὰ δʼ ἀνδρεῖα ἀνδρεῖοι"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („men become builders by building houses, harpers by playing on the harp“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1103b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 2, 1103b27–29
    cesky: "Nezkoumáme proto, abychom věděli, co je ctnost, ale abychom se stali dobrými. Jinak by to zkoumání nebylo k ničemu."
    original: "οὐ γὰρ ἵνα εἰδῶμεν τί ἐστιν ἡ ἀρετὴ σκεπτόμεθα, ἀλλʼ ἵνʼ ἀγαθοὶ γενώμεθα, ἐπεὶ οὐδὲν ἂν ἦν ὄφελος αὐτῆς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-ii
  - id: etika-1105b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 4, 1105b12–16
    cesky: "Většina lidí to ale nedělá. Utíkají se k řečem a myslí si, že filozofují a že se tak stanou dobrými. Dělají totéž co nemocní, kteří lékaře pozorně poslouchají, ale nedělají nic z toho, co jim nařídil."
    original: "ἀλλʼ οἱ πολλοὶ ταῦτα μὲν οὐ πράττουσιν, ἐπὶ δὲ τὸν λόγον καταφεύγοντες οἴονται φιλοσοφεῖν καὶ οὕτως ἔσεσθαι σπουδαῖοι, ὅμοιόν τι ποιοῦντες τοῖς κάμνουσιν, οἳ τῶν ἰατρῶν ἀκούουσι μὲν ἐπιμελῶς, ποιοῦσι δʼ οὐδὲν τῶν προσταττομένων"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („like invalids who listen carefully to what the doctor says, but entirely neglect to carry out his prescriptions“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1106a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106a17–19
    cesky: "Ctnost oka dělá dobrým oko i jeho práci: díky ctnosti oka dobře vidíme."
    original: "ἡ τοῦ ὀφθαλμοῦ ἀρετὴ τόν τε ὀφθαλμὸν σπουδαῖον ποιεῖ καὶ τὸ ἔργον αὐτοῦ· τῇ γὰρ τοῦ ὀφθαλμοῦ ἀρετῇ εὖ ὁρῶμεν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama, který tu ἀρετή překládá „excellence“; hned potom má Aristotelés ctnost koně: dobře běží, nese jezdce a obstojí před nepřítelem"
    zdroj: aristoteles-etika-ii
  - id: etika-1106b-milon
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106b1–5
    cesky: "Je-li pro někoho deset min jídla mnoho a dvě málo, trenér mu proto ještě nepředepíše šest. I to je pro toho, kdo je má dostat, možná mnoho, nebo málo: pro Milóna málo, pro toho, kdo s cvičením začíná, mnoho. Stejně je to s během a se zápasem."
    original: "οὐ γὰρ εἴ τῳ δέκα μναῖ φαγεῖν πολὺ δύο δὲ ὀλίγον, ὁ ἀλείπτης ἓξ μνᾶς προστάξει· ἔστι γὰρ ἴσως καὶ τοῦτο πολὺ τῷ ληψομένῳ ἢ ὀλίγον· Μίλωνι μὲν γὰρ ὀλίγον, τῷ δὲ ἀρχομένῳ τῶν γυμνασίων πολύ. ὁμοίως ἐπὶ δρόμου καὶ πάλης"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; příklad je o dávce jídla, ve studentském textu ho raději vyprávět na běhu a zápase (podkladový list, Koho může řeč o návyku zranit)"
    zdroj: aristoteles-etika-ii
  - id: etika-1106b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106b21–23
    cesky: "Ale tehdy, kdy se má, nad čím se má, vůči komu se má, kvůli čemu se má a jak se má: to je střed a to nejlepší, a právě to je vlastní ctnosti."
    original: "τὸ δʼ ὅτε δεῖ καὶ ἐφʼ οἷς καὶ πρὸς οὓς καὶ οὗ ἕνεκα καὶ ὡς δεῖ, μέσον τε καὶ ἄριστον, ὅπερ ἐστὶ τῆς ἀρετῆς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; řeč je o tom, kdy se bát, odvážit, toužit, hněvat se a litovat (1106b18–21), věta před citátem to musí říct"
    zdroj: aristoteles-etika-ii
  - id: etika-1107a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106b36–1107a2
    cesky: "Ctnost je tedy ustálený stav, ze kterého člověk volí. Spočívá ve středu vzhledem k nám, a ten určuje rozum, a to tak, jak by ho určil rozumný člověk."
    original: "ἔστιν ἄρα ἡ ἀρετὴ ἕξις προαιρετική, ἐν μεσότητι οὖσα τῇ πρὸς ἡμᾶς, ὡρισμένῃ λόγῳ καὶ ᾧ ἂν ὁ φρόνιμος ὁρίσειεν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („a settled disposition of the mind determining the choice of actions and emotions, consisting essentially in the observance of the mean relative to us“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1109a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 9, 1109a26–29
    cesky: "Rozhněvat se dokáže každý a je to snadné, stejně jako dát nebo utratit peníze. Ale komu, kolik, kdy, kvůli čemu a jak: to už nedokáže každý a snadné to není."
    original: "τὸ μὲν ὀργισθῆναι παντὸς καὶ ῥᾴδιον, καὶ τὸ δοῦναι ἀργύριον καὶ δαπανῆσαι· τὸ δʼ ᾧ καὶ ὅσον καὶ ὅτε καὶ οὗ ἕνεκα καὶ ὥς, οὐκέτι παντὸς οὐδὲ ῥᾴδιον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-ii
  - id: etika-1109b-drevo
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 9, 1109b4–7
    cesky: "Musíme se táhnout na opačnou stranu. Když se od chyby hodně vzdálíme, dojdeme ke středu, jako to dělají ti, kdo rovnají pokřivené dřevo."
    original: "εἰς τοὐναντίον δʼ ἑαυτοὺς ἀφέλκειν δεῖ· πολὺ γὰρ ἀπάγοντες τοῦ ἁμαρτάνειν εἰς τὸ μέσον ἥξομεν, ὅπερ οἱ τὰ διεστραμμένα τῶν ξύλων ὀρθοῦντες ποιοῦσιν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; předchází rada všimnout si, k čemu má člověk sám sklon (1109b1–4)"
    zdroj: aristoteles-etika-ii
  - id: etika-1109b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 9, 1109b20–23
    cesky: "Po jakou mez a jak moc se člověk smí odchýlit, než si zaslouží výtku, není snadné vymezit slovy. Takové věci záleží na jednotlivých případech a rozhoduje o nich vnímání."
    original: "ὁ δὲ μέχρι τίνος καὶ ἐπὶ πόσον ψεκτὸς οὐ ῥᾴδιον τῷ λόγῳ ἀφορίσαι … τὰ δὲ τοιαῦτα ἐν τοῖς καθʼ ἕκαστα, καὶ ἐν τῇ αἰσθήσει ἡ κρίσις"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („the decision lies with perception“); vypuštěna vsuvka, že totéž platí o všem, co se vnímá"
    zdroj: aristoteles-etika-ii
  - id: etika-1095a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: I, 3, 1095a2–8
    cesky: "Mladý člověk proto není vhodný posluchač výkladů o obci: nemá zkušenost s tím, co se v životě dělá. Nezáleží ale na tom, jestli je někdo mladý věkem, nebo nezralý povahou. Nechybí mu čas, chyba je v tom, že žije podle vášně."
    original: "διὸ τῆς πολιτικῆς οὐκ ἔστιν οἰκεῖος ἀκροατὴς ὁ νέος· ἄπειρος γὰρ τῶν κατὰ τὸν βίον πράξεων … διαφέρει δʼ οὐδὲν νέος τὴν ἡλικίαν ἢ τὸ ἦθος νεαρός· οὐ γὰρ παρὰ τὸν χρόνον ἡ ἔλλειψις, ἀλλὰ διὰ τὸ κατὰ πάθος ζῆν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; zkráceno o větu, že takovému posluchači je vědění k ničemu, protože cílem není poznání, ale jednání (1095a4–6)"
    zdroj: aristoteles-etika-ii
  - id: etika-1179b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 9, 1179b2–3
    cesky: "Ani u ctnosti tedy nestačí vědět. Musíme se snažit ji mít a užívat."
    original: "οὐδὲ δὴ περὶ ἀρετῆς ἱκανὸν τὸ εἰδέναι, ἀλλʼ ἔχειν καὶ χρῆσθαι πειρατέον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („to know what virtue is is not enough“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1179b-reci
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 9, 1179b4–6
    cesky: "Kdyby řeči samy stačily na to, aby z lidí udělaly slušné lidi, právem by vynášely mnoho velkých odměn."
    original: "εἰ μὲν οὖν ἦσαν οἱ λόγοι αὐτάρκεις πρὸς τὸ ποιῆσαι ἐπιεικεῖς, πολλοὺς ἂν μισθοὺς καὶ μεγάλους δικαίως ἔφερον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; vypuštěno „jak říká Theognis“"
    zdroj: aristoteles-etika-ii
  - id: etika-1179b-puda
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 9, 1179b23–26
    cesky: "Řeč a poučení nejspíš nemají sílu u každého. Duši posluchače je třeba napřed zvyky připravit, aby se správně radovala a správně nenáviděla, jako půdu, která má živit semeno."
    original: "ὁ δὲ λόγος καὶ ἡ διδαχὴ μή ποτʼ οὐκ ἐν ἅπασιν ἰσχύει, ἀλλὰ δεῖ προδιειργάσθαι τοῖς ἔθεσι τὴν τοῦ ἀκροατοῦ ψυχὴν πρὸς τὸ καλῶς χαίρειν καὶ μισεῖν, ὥσπερ γῆν τὴν θρέψουσαν τὸ σπέρμα"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-ii
  - id: etika-1145b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 2, 1145b23–28
    cesky: "Bylo by přece podivné, myslel si Sókratés, kdyby v člověku bylo vědění a vládlo mu něco jiného a vláčelo vědění sem a tam jako otroka. Sókratés proti té představě bojoval vůbec, jako by neovládnutí nebylo: nikdo prý nejedná proti tomu, co má za nejlepší, leda z nevědomosti. Tenhle výklad je ale ve zjevném rozporu s tím, co vidíme."
    original: "δεινὸν γὰρ ἐπιστήμης ἐνούσης, ὡς ᾤετο Σωκράτης, ἄλλο τι κρατεῖν καὶ περιέλκειν αὐτὴν ὥσπερ ἀνδράποδον. Σωκράτης μὲν γὰρ ὅλως ἐμάχετο πρὸς τὸν λόγον ὡς οὐκ οὔσης ἀκρασίας· οὐθένα γὰρ ὑπολαμβάνοντα πράττειν παρὰ τὸ βέλτιστον, ἀλλὰ διʼ ἄγνοιαν. οὗτος μὲν οὖν ὁ λόγος ἀμφισβητεῖ τοῖς φαινομένοις ἐναργῶς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („this theory is manifestly at variance with plain facts“); τὰ φαινόμενα lze číst i jako „to, co se obecně soudí“. Věta pokračuje: je třeba zkoumat, o jaký druh nevědomosti jde (1145b28–29)"
    zdroj: aristoteles-etika-vii
  - id: etika-1147a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 3, 1147a21–22
    cesky: "Ti, kdo se něco právě naučili, umějí řadit slova za sebe, ale ještě to nevědí. Musí to s nimi srůst, a to chce čas."
    original: "οἱ πρῶτον μαθόντες συνείρουσι μὲν τοὺς λόγους, ἴσασι δʼ οὔπω· δεῖ γὰρ συμφυῆναι, τοῦτο δὲ χρόνου δεῖται"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („knowledge has to become part of the tissue of the mind, and this takes time“)"
    zdroj: aristoteles-etika-vii
  - id: etika-1147b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 3, 1147b14–17
    cesky: "A zdá se, že vychází to, oč šlo Sókratovi: ten stav nenastává, když je přítomno to, co se pokládá za vědění v pravém smyslu, a takové vědění vášeň sem a tam nevláčí. Vláčí jen to, které stojí na vnímání."
    original: "καὶ ἔοικεν ὃ ἐζήτει Σωκράτης συμβαίνειν· οὐ γὰρ τῆς κυρίως ἐπιστήμης εἶναι δοκούσης παρούσης γίνεται τὸ πάθος, οὐδʼ αὕτη περιέλκεται διὰ τὸ πάθος, ἀλλὰ τῆς αἰσθητικῆς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („we do seem to be led to the conclusion which Socrates sought to establish“)"
    zdroj: aristoteles-etika-vii
  - id: etika-1149a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 6, 1149a25–29
    cesky: "Hněv, zdá se, rozum trochu poslouchá, ale přeslechne ho. Je jako ukvapení sluhové, kteří vyběhnou, než vyslechnou všechno, co se jim říká, a příkaz pak spletou. A jako psi, kteří se rozštěkají, sotva se něco ozve, dřív než se podívají, jestli to není přítel."
    original: "ἔοικε γὰρ ὁ θυμὸς ἀκούειν μέν τι τοῦ λόγου, παρακούειν δέ, καθάπερ οἱ ταχεῖς τῶν διακόνων, οἳ πρὶν ἀκοῦσαι πᾶν τὸ λεγόμενον ἐκθέουσιν, εἶτα ἁμαρτάνουσι τῆς προστάξεως, καὶ οἱ κύνες, πρὶν σκέψασθαι εἰ φίλος, ἂν μόνον ψοφήσῃ, ὑλακτοῦσιν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („watch-dogs bark at a mere knock at the door, without waiting to see if it is a friend“)"
    zdroj: aristoteles-etika-vii
  - id: etika-1152a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 10, 1152a20–21
    cesky: "Člověk, který se neovládne, se podobá obci, která odhlasuje všechno, co má, a má dobré zákony, ale žádným se neřídí."
    original: "ἔοικε δὴ ὁ ἀκρατὴς πόλει ἣ ψηφίζεται μὲν ἅπαντα τὰ δέοντα καὶ νόμους ἔχει σπουδαίους, χρῆται δὲ οὐδέν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; špatný člověk je naopak obec, která se zákony řídí, ale má je špatné (1152a24)"
    zdroj: aristoteles-etika-vii
  - id: protagoras-352b
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 352b–c
    cesky: "Myslí si o vědění zkrátka totéž co o otrokovi: že ho všechno ostatní vláčí sem a tam."
    original: "ἀτεχνῶς διανοούμενοι περὶ τῆς ἐπιστήμης ὥσπερ περὶ ἀνδραπόδου, περιελκομένης ὑπὸ τῶν ἄλλων ἁπάντων"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba („just what they have about a slave, that it may be dragged about by any other force“); Sókratés tak líčí mínění většiny, se kterým nesouhlasí"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-352c
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 352c
    cesky: "Nebo je vědění něco krásného, co dokáže člověku vládnout? A kdo pozná, co je dobré a co zlé, toho už nic nepřemůže, aby dělal něco jiného, než mu vědění velí?"
    original: "ἢ καλόν τε εἶναι ἡ ἐπιστήμη καὶ οἷον ἄρχειν τοῦ ἀνθρώπου, καὶ ἐάνπερ γιγνώσκῃ τις τἀγαθὰ καὶ τὰ κακά, μὴ ἂν κρατηθῆναι ὑπὸ μηδενὸς ὥστε ἄλλʼ ἄττα πράττειν ἢ ἃν ἐπιστήμη κελεύῃ"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; Sókratova otázka Prótagorovi, který přitaká (352c–d)"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-352d
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 352d
    cesky: "Většina lidí mně ani tobě nevěří. Říkají, že mnozí vědí, co je nejlepší, a nechtějí to dělat, ačkoli by mohli, a dělají něco jiného."
    original: "οἱ πολλοὶ τῶν ἀνθρώπων ἐμοί τε καὶ σοὶ οὐ πείθονται, ἀλλὰ πολλούς φασι γιγνώσκοντας τὰ βέλτιστα οὐκ ἐθέλειν πράττειν, ἐξὸν αὐτοῖς, ἀλλὰ ἄλλα πράττειν"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; Sókratés mluví k Prótagorovi"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-356c
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 356c
    cesky: "Nezdají se vám tytéž velikosti zblízka větší a zdálky menší?"
    original: "φαίνεται ὑμῖν τῇ ὄψει τὰ αὐτὰ μεγέθη ἐγγύθεν μὲν μείζω, πόρρωθεν δὲ ἐλάττω· ἢ οὔ;"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; otázka, kterou Sókratés klade domnělé většině"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-358c
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 358c
    cesky: "Podléhat sám sobě není nic jiného než nevědomost a vládnout sám sobě nic jiného než moudrost."
    original: "οὐδὲ τὸ ἥττω εἶναι αὑτοῦ ἄλλο τι τοῦτʼ ἐστὶν ἢ ἀμαθία, οὐδὲ κρείττω ἑαυτοῦ ἄλλο τι ἢ σοφία"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; závěr je vyvozen z předpokladu „je-li příjemné dobrem“ (358b), se kterým sofisté souhlasili"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-358d
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 358c–d
    cesky: "Nikdo nejde dobrovolně za zlem, ani za tím, co za zlé pokládá. Není to, jak se zdá, v lidské přirozenosti."
    original: "ἐπί γε τὰ κακὰ οὐδεὶς ἑκὼν ἔρχεται οὐδὲ ἐπὶ ἃ οἴεται κακὰ εἶναι, οὐδʼ ἔστι τοῦτο, ὡς ἔοικεν, ἐν ἀνθρώπου φύσει"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; v řečtině otázka („není tomu tak, že…?“), se kterou všichni přítomní souhlasí"
    zdroj: platon-protagoras-vedeni
  - id: metafyzika-981a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Metafyzika
    misto: I, 1, 981a18–20
    cesky: "Kdo léčí, neuzdravuje člověka, leda mimochodem, ale Kalliu nebo Sókrata nebo někoho dalšího, kdo má takhle jméno a kdo je také člověk."
    original: "οὐ γὰρ ἄνθρωπον ὑγιάζει ὁ ἰατρεύων ἀλλʼ ἢ κατὰ συμβεβηκός, ἀλλὰ Καλλίαν ἢ Σωκράτην ἢ τῶν ἄλλων τινὰ τῶν οὕτω λεγομένων ᾧ συμβέβηκεν ἀνθρώπῳ εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka; hned potom Aristotelés dodává, že moudřejší je přesto ten, kdo zná příčinu (981a24–30)"
    zdroj: aristoteles-metafyzika-ideje
  - id: casti-zivocichu-i-5
    osoba: aristoteles
    autor: Aristotelés
    dilo: O částech živočichů
    misto: I, 5
    cesky: "Nemáme se proto dětinsky štítit zkoumání méně vznešených živočichů. Ve všem přírodním je totiž něco podivuhodného."
    original: "διὸ δεῖ μὴ δυσχεραίνειν παιδικῶς τὴν περὶ τῶν ἀτιμοτέρων ζῴων ἐπίσκεψιν. ἐν πᾶσι γὰρ τοῖς φυσικοῖς ἔνεστί τι θαυμαστόν"
    preklad:
      druh: vlastni
      podle: "řecký text (B. Langkavel) a anglická věta citovaná v SEP („we should not be childishly disgusted at the examination of the less valuable animals“); běžně se cituje jako 645a15–17, ve vydání číslování není"
    zdroj: aristoteles-casti-zivocichu
  - id: zivocichove-vi-3
    osoba: aristoteles
    autor: Aristotelés
    dilo: Zkoumání živočichů
    misto: VI, 3
    cesky: "Srdce je vidět v bílku jako krvavá tečka. Ta tečka poskakuje a hýbe se, jako by byla živá."
    original: "ὅσον στιγμὴ αἱματίνη ἐν τῷ λευκῷ ἡ καρδία. τοῦτο δὲ τὸ σημεῖον πηδᾷ καὶ κινεῖται ὥσπερ ἔμψυχον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bekker, vydání 1837), bez srovnání s publikovaným překladem; řeč je o slepičím vejci po třech dnech a nocích; Bekkerovo číslování ve vydání není"
    zdroj: aristoteles-zivocichove
  - id: zivocichove-viii-2
    osoba: aristoteles
    autor: Aristotelés
    dilo: Zkoumání živočichů
    misto: VIII, 2
    cesky: "Žádného z nich není snadné zařadit jen mezi vodní živočichy, ani jen mezi suchozemské."
    original: "οὐ γὰρ ῥᾴδιον οὔτʼ ἔνυδρον θεῖναι μόνον τούτων ἕκαστον οὔτε πεζόν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bekker, vydání 1837), bez srovnání s publikovaným překladem; řeč je o delfínovi a ostatních kytovcích; Bekkerovo číslování ve vydání není"
    zdroj: aristoteles-zivocichove
  - id: fyzika-ii-3-proc
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 3
    cesky: "Myslíme si, že věc známe, teprve když u ní pochopíme, proč je."
    original: "εἰδέναι δὲ οὐ πρότερον οἰόμεθα ἕκαστον πρὶν ἂν λάβωμεν τὸ διὰ τί περὶ ἕκαστον"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; běžně se cituje jako 194b18–20, ve vydání číslování není"
    zdroj: aristoteles-fyzika
  - id: fyzika-ii-3-prochazka
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 3
    cesky: "Proč se prochází? Řekneme: ‚Aby byl zdravý.‘ A když to řekneme, myslíme si, že jsme udali příčinu."
    original: "διὰ τί γὰρ περιπατεῖ; φαμέν “ἵνα ὑγιαίνῃ”, καὶ εἰπόντες οὕτως οἰόμεθα ἀποδεδωκέναι τὸ αἴτιον"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; běžně se cituje jako 194b33–35, ve vydání číslování není"
    zdroj: aristoteles-fyzika
  - id: fyzika-ii-8
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 8
    cesky: "Co brání tomu, aby příroda nedělala nic kvůli něčemu ani proto, že je to tak lepší? Aby to bylo, jako když Zeus prší: ne proto, aby rostlo obilí, ale z nutnosti."
    original: "τί κωλύει τὴν φύσιν μὴ ἕνεκά του ποιεῖν μηδʼ ὅτι βέλτιον, ἀλλʼ ὥσπερ ὕει ὁ Ζεὺς οὐχ ὅπως τὸν σῖτον αὐξήσῃ, ἀλλʼ ἐξ ἀνάγκης"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; Aristotelés tu formuluje námitku, kterou vzápětí odmítá; běžně se cituje jako 198b16–19, ve vydání číslování není"
    zdroj: aristoteles-fyzika
  - id: fyzika-ii-8-prezilo
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 8
    cesky: "Kde se všechno sešlo tak, jako by to vzniklo kvůli něčemu, tam to přežilo, protože se to samo od sebe složilo vhodně. Co se tak nesložilo, zahynulo a hyne."
    original: "ὅπου μὲν οὖν ἅπαντα συνέβη ὥσπερ κἂν εἰ ἕνεκά του ἐγίγνετο, ταῦτα μὲν ἐσώθη ἀπὸ τοῦ αὐτομάτου συστάντα ἐπιτηδείως· ὅσα δὲ μὴ οὕτως, ἀπώλετο καὶ ἀπόλλυται"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; pokračování téže námitky s odkazem na Empedoklea; Aristotelés ji odmítá („takhle to být nemůže“); běžně se cituje jako 198b29–32"
    zdroj: aristoteles-fyzika
  - id: analytiky-i-1
    osoba: aristoteles
    autor: Aristotelés
    dilo: První analytiky
    misto: I, 1
    cesky: "Úsudek je řeč, ve které se něco stanoví a z toho, že to platí, nutně vyplyne něco jiného."
    original: "συλλογισμὸς δέ ἐστι λόγος ἐν ᾧ τεθέντων τινῶν ἕτερόν τι τῶν κειμένων ἐξ ἀνάγκης συμβαίνει τῷ ταῦτα εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; běžně se cituje jako 24b18–20, ve vydání číslování není"
    zdroj: aristoteles-analytiky
  - id: etika-1155b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 2, 1155b29–31
    cesky: "Bylo by asi směšné přát vínu dobro. Leda si člověk přeje, aby vydrželo, aby ho měl on sám. Příteli se ale, jak se říká, má přát dobro kvůli němu."
    original: "γελοῖον γὰρ ἴσως τῷ οἴνῳ βούλεσθαι τἀγαθά, ἀλλʼ εἴπερ, σῴζεσθαι βούλεται αὐτόν, ἵνα αὐτὸς ἔχῃ· τῷ δὲ φίλῳ φασὶ δεῖν βούλεσθαι τἀγαθὰ ἐκείνου ἕνεκα"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („it would be ridiculous to wish well to a bottle of wine“)"
    zdroj: aristoteles-etika-viii
  - id: etika-1156a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 3, 1156a19–21
    cesky: "Taková přátelství se snadno rozpadají, když ti dva nezůstanou stejní: jakmile si přestanou být příjemní nebo užiteční, přestanou se mít rádi."
    original: "εὐδιάλυτοι δὴ αἱ τοιαῦταί εἰσι, μὴ διαμενόντων αὐτῶν ὁμοίων· ἐὰν γὰρ μηκέτι ἡδεῖς ἢ χρήσιμοι ὦσι, παύονται φιλοῦντες"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; řeč je o přátelstvích pro užitek a pro příjemnost"
    zdroj: aristoteles-etika-viii
  - id: etika-1156b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 3, 1156b31–32
    cesky: "Přání být přáteli vzniká rychle, přátelství ne."
    original: "βούλησις μὲν γὰρ ταχεῖα φιλίας γίνεται, φιλία δʼ οὔ"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („the wish to be friends is a quick growth, but friendship is not“)"
    zdroj: aristoteles-etika-viii
  - id: politika-1253a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 2, 1253a2–3
    cesky: "Člověk je od přírody tvor obce."
    original: "ὁ ἄνθρωπος φύσει πολιτικὸν ζῷον"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama („man is by nature a political animal“)"
    zdroj: aristoteles-politika-i
  - id: politika-1253a-buh
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 2, 1253a27–29
    cesky: "Kdo nedokáže žít ve společenství nebo je tak soběstačný, že nic nepotřebuje, není částí obce: je to buď zvíře, nebo bůh."
    original: "ὁ δὲ μὴ δυνάμενος κοινωνεῖν ἢ μηδὲν δεόμενος διʼ αὐτάρκειαν οὐθὲν μέρος πόλεως, ὥστε ἢ θηρίον ἢ θεός"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama"
    zdroj: aristoteles-politika-i
  - id: politika-1253b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 3, 1253b20–23
    cesky: "Jiní mají za to, že být pánem otroka je proti přírodě: jeden je prý otrok a druhý svobodný jen podle zákona, od přírody se ničím neliší. Proto to prý ani není spravedlivé, je to totiž násilí."
    original: "τοῖς δὲ παρὰ φύσιν τὸ δεσπόζειν (νόμῳ γὰρ τὸν μὲν δοῦλον εἶναι τὸν δʼ ἐλεύθερον, φύσει δʼ οὐθὲν διαφέρειν)· διόπερ οὐδὲ δίκαιον· βίαιον γάρ"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; Aristotelés tu uvádí názor jiných, se kterým nesouhlasí; koho míní, neříká"
    zdroj: aristoteles-politika-i
  - id: politika-1253b-clunky
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 4, 1253b33–1254a1
    cesky: "Kdyby každý nástroj dokázal na pokyn, nebo protože sám tuší, co je třeba, vykonat svou práci, kdyby člunky tkaly samy a trsátka sama hrála na kitharu, nepotřebovali by stavitelé pomocníky ani páni otroky."
    original: "εἰ γὰρ ἠδύνατο ἕκαστον τῶν ὀργάνων κελευσθὲν ἢ προαισθανόμενον ἀποτελεῖν τὸ αὑτοῦ ἔργον … οὕτως αἱ κερκίδες ἐκέρκιζον αὐταὶ καὶ τὰ πλῆκτρα ἐκιθάριζεν, οὐδὲν ἂν ἔδει οὔτε τοῖς ἀρχιτέκτοσιν ὑπηρετῶν οὔτε τοῖς δεσπόταις δούλων"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; vypuštěno přirovnání k Daidalovým sochám a Héfaistovým trojnožkám"
    zdroj: aristoteles-politika-i
  - id: politika-1255a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 5, 1255a1–3
    cesky: "Je tedy zřejmé, že někteří lidé jsou od přírody svobodní a jiní otroci, a pro ty je otroctví prospěšné i spravedlivé."
    original: "ὅτι μὲν τοίνυν εἰσὶ φύσει τινὲς οἱ μὲν ἐλεύθεροι οἱ δὲ δοῦλοι, φανερόν, οἷς καὶ συμφέρει τὸ δουλεύειν καὶ δίκαιόν ἐστιν"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; hned potom Aristotelés připouští, že odpůrci mají „v jistém smyslu“ pravdu (1255a3–4)"
    zdroj: aristoteles-politika-i
  - id: politika-1260a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 13, 1260a12–14
    cesky: "Otrok schopnost rozvažovat vůbec nemá, žena ji má, ale bez rozhodující váhy, a dítě ji má, ale nehotovou."
    original: "ὁ μὲν γὰρ δοῦλος ὅλως οὐκ ἔχει τὸ βουλευτικόν, τὸ δὲ θῆλυ ἔχει μέν, ἀλλʼ ἄκυρον, ὁ δὲ παῖς ἔχει μέν, ἀλλʼ ἀτελές"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; ἄκυρον překládá SEP „without authority“"
    zdroj: aristoteles-politika-i
  # Výroky a závěť, jak je podává Diogenés Laertios asi 550 let po Aristotelovi, a Ailiános asi 520 let po něm: tradované.
  - id: dl-v-15
    osoba: aristoteles
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 15
    cesky: "Z otroků, kteří mi sloužili, ať není nikdo prodán. Ať slouží dál, a až dospějí, ať jsou propuštěni na svobodu, jak si zaslouží."
    original: "μὴ πωλεῖν δὲ τῶν παίδων μηδένα τῶν ἐμὲ θεραπευόντων, ἀλλὰ χρῆσθαι αὐτοῖς· ὅταν δʼ ἐν ἡλικίᾳ γένωνται, ἐλευθέρους ἀφεῖναι κατʼ ἀξίαν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („none of the servants who waited upon me shall be sold“); ze závěti, jak ji uvádí Diogenés Laertios"
    zdroj: dl-v
  - id: dl-v-16
    osoba: aristoteles
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 16
    cesky: "Ať mě pohřbí kdekoli, tam ať přenesou a uloží i kosti Pýthiady, jak sama nařídila."
    original: "ὅπου δʼ ἂν ποιῶνται τὴν ταφήν, ἐνταῦθα καὶ τὰ Πυθιάδος ὀστᾶ ἀνελόντας θεῖναι, ὥσπερ αὐτὴ προσέταξεν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; ze závěti, jak ji uvádí Diogenés Laertios"
    zdroj: dl-v
  - id: dl-v-18
    osoba: aristoteles
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 18
    cesky: "Kořeny vzdělání jsou hořké, ale ovoce sladké."
    original: "τῆς παιδείας ἔφη τὰς μὲν ῥίζας εἶναι πικράς, τὸν δὲ καρπὸν γλυκύν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; tradovaný výrok v nepřímé řeči („říkal, že…“); Afthonios ho ve 4. století n. l. připisuje Isokratovi"
    zdroj: dl-v
  - id: dl-v-20
    osoba: aristoteles
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 20
    cesky: "Jedna duše, která bydlí ve dvou tělech."
    original: "μία ψυχὴ δύο σώμασιν ἐνοικοῦσα"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; tradovaná odpověď na otázku, co je přítel"
    zdroj: dl-v
  - id: ailianos-iii-36
    osoba: aristoteles
    autor: Ailiános
    dilo: Pestré příběhy
    misto: III, 36
    cesky: "Nechci, aby se Athéňané provinili proti filozofii podruhé."
    original: "ἀπεκρίνατο ὅτι οὐ βούλεται Ἀθηναίους δὶς ἐξαμαρτεῖν ἐς φιλοσοφίαν"
    preklad:
      druh: vlastni
      podle: "řecký text (R. Hercher), bez srovnání s publikovaným překladem; u Ailiana v nepřímé řeči („odpověděl, že nechce…“), tradovaný výrok; Ailiános dodává, že tím narážel na Sókratův osud"
    zdroj: ailianos-vh
  # Celek 6 „Proč se bát smrti?“ (docs/podklady/celek-6-proc-se-bat-smrti.md). Vlastní převody z latinského a řeckého textu;
  # publikované české překlady jsem neměl v ruce. „Smrt se nás netýká“ = ὁ θάνατος οὐδὲν πρὸς ἡμᾶς (doslova „smrt není nic vůči nám“).
  # U Platónova Faidónu je osoba platon a v poli podle stojí, že větu říká Sókratés; u Obrany je osoba sokrates jako v celku 1.
  # Seneca, portrét
  - id: seneca-ep-106-12
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 106, 12
    cesky: "Neučíme se pro život, ale pro školu."
    original: "non vitae sed scholae discimus"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); Seneca si tu stěžuje na filozofické hříčky; školní heslo větu obrátilo"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-75-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 75, 4
    cesky: "Mluvme, jak smýšlíme, a smýšlejme, jak mluvíme. Ať řeč ladí se životem."
    original: "quod sentimus loquamur, quod loquimur sentiamus; concordet sermo cum vita"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-8-3
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 8, 3
    cesky: "Správnou cestu, kterou jsem poznal pozdě a unavený blouděním, ukazuji druhým."
    original: "Rectum iter, quod sero cognovi et lassus errando, aliis monstro."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-8-2
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 8, 2
    cesky: "Pracuji pro ty, kdo přijdou po nás. Pro ně zapisuji, co by jim mohlo být k užitku."
    original: "posterorum negotium ago; illis aliqua, quae possint prodesse, conscribo"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-75-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 75, 1
    cesky: "Chci, aby mé dopisy byly takové, jaká by byla má řeč, kdybychom spolu seděli nebo se procházeli: nenucené a lehké."
    original: "Qualis sermo meus esset, si una sederemus aut ambularemus, inlaboratus et facilis, tales esse epistulas meas volo"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); zkráceno"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-12-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 12, 1
    cesky: "Kam se otočím, vidím důkazy svého stáří."
    original: "Quocumque me verti, argumenta senectutis meae video."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-78-2
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 78, 2
    cesky: "Poručil jsem si tedy žít. Někdy je totiž statečné i žít."
    original: "Itaque imperavi mihi, ut viverem. Aliquando enim et vivere fortiter facere est."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o nemoci v mládí, kdy ho při životě držel ohled na starého otce"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-47-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 47, 1
    cesky: "‚Jsou to otroci.‘ Ne, lidé. ‚Jsou to otroci.‘ Ne, ti, kdo s tebou bydlí pod jednou střechou. ‚Jsou to otroci.‘ Ne, přátelé v nízkém postavení. ‚Jsou to otroci.‘ Ne, otroci stejně jako ty, když si uvědomíš, že osud má nad vámi oběma stejnou moc."
    original: "Servi sunt. Immo homines. Servi sunt. Immo contubernales. Servi sunt. Immo humiles amici. Servi sunt. Immo conservi, si cogitaveris tantundem in utrosque licere fortunae."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); contubernales = kdo sdílejí stan nebo dům, conservi = spoluotroci"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-47-10
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 47, 10
    cesky: "Pomysli, že ten, komu říkáš svůj otrok, vzešel ze stejných semen jako ty, má nad sebou stejné nebe, stejně dýchá, stejně žije a stejně umírá."
    original: "Vis tu cogitare istum, quem servum tuum vocas, ex isdem seminibus ortum eodem frui caelo, aeque spirare, aeque vivere, aeque mori!"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-47-11
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 47, 11
    cesky: "Žij s tím, kdo je níž než ty, tak, jak bys chtěl, aby s tebou žil ten, kdo je výš."
    original: "sic cum inferiore vivas, quemadmodum tecum superiorem velis vivere"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ira-ii-29
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: II, 29, 1
    cesky: "Největší lék na hněv je odklad."
    original: "Maximum remedium irae mora est."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); podobně III, 12, 4: „maximum remedium irae dilatio est“"
    zdroj: seneca-de-ira
  - id: seneca-ira-iii-36
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: III, 36, 3
    cesky: "Když odnesou světlo a žena, která můj zvyk už zná, zmlkne, projdu celý svůj den a znovu přeměřím, co jsem udělal a řekl. Nic před sebou neskrývám, nic nepřecházím."
    original: "Cum sublatum e conspectu lumen est et conticuit uxor moris iam mei conscia, totum diem meum scrutor factaque ac dicta mea remetior; nihil mihi ipse abscondo, nihil transeo."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library)"
    zdroj: seneca-de-ira
  - id: seneca-ira-iii-36-otazky
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: III, 36, 1
    cesky: "Kterou svou chybu jsi dnes vyléčil? Které špatnosti ses postavil? V čem jsi lepší?"
    original: "quod hodie malum tuum sanasti? Cui vitio obstitisti? Qua parte melior es?"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); otázky, které si podle Seneky večer kladl filozof Sextius; věta před citátem to musí říct"
    zdroj: seneca-de-ira
  - id: seneca-ira-iii-36-odpoustim
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: III, 36, 3
    cesky: "Hleď, ať to už neuděláš. Teď ti odpouštím."
    original: "vide ne istud amplius facias, nunc tibi ignosco"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); tak Seneca večer mluví sám k sobě"
    zdroj: seneca-de-ira
  - id: seneca-ep-28-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 28, 1
    cesky: "Musíš změnit mysl, ne oblohu."
    original: "Animum debes mutare, non caelum."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-7-3
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 7, 3
    cesky: "Vracím se lakotnější, ctižádostivější, rozmařilejší, ba i krutější a nelidštější, protože jsem byl mezi lidmi."
    original: "Avarior redeo, ambitiosior, luxuriosior, immo vero crudelior et inhumanior, quia inter homines fui."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-clem-i-1
    osoba: seneca
    autor: Seneca
    dilo: O mírnosti
    misto: I, 1, 1
    cesky: "Rozhodl jsem se psát o mírnosti, císaři Nerone, abych ti byl jaksi zrcadlem a ukázal ti tebe samého."
    original: "Scribere de clementia, Nero Caesar, institui, ut quodam modo speculi vice fungerer et te tibi ostenderem"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); zkráceno"
    zdroj: seneca-clementia
  # Cesta 8: Epikúros
  - id: dl-x-22-den
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis z posledního dne
    misto: Diogenés Laertios X, 22
    cesky: "Píšu vám tohle ve šťastný a zároveň poslední den svého života."
    original: "Τὴν μακαρίαν ἄγοντες καὶ ἅμα τελευταίαν ἡμέραν τοῦ βίου ἐγράφομεν ὑμῖν ταυτί."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); μακαρία = blažený; Cicero (O nejvyšším dobru a zlu II, 96) uvádí týž dopis s adresátem Hermarchem"
    zdroj: dl-x-22
  - id: dl-x-22-radost
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis z posledního dne
    misto: Diogenés Laertios X, 22
    cesky: "Proti tomu všemu se ale stavěla radost v duši ze vzpomínky na úvahy, které jsme spolu vedli."
    original: "ἀντιπαρετάττετο δὲ πᾶσι τούτοις τὸ κατὰ ψυχὴν χαῖρον ἐπὶ τῇ τῶν γεγονότων ἡμῖν διαλογισμῶν μνήμῃ"
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); διαλογισμοί jsou úvahy i rozhovory: Hicks má „past conversations“, Cicero „rationum inventorumque nostrorum“ (naše úvahy a objevy)"
    zdroj: dl-x-22
  - id: dl-x-22-deti
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis z posledního dne
    misto: Diogenés Laertios X, 22
    cesky: "A ty se postarej o Métrodórovy děti, jak se sluší na to, jak jsi od mládí stál při mně i při filozofii."
    original: "σὺ δʼ ἀξίως τῆς ἐκ μειρακίου παραστάσεως πρὸς ἐμὲ καὶ φιλοσοφίαν ἐπιμελοῦ τῶν παίδων Μητροδώρου."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-22
  - id: menoikeus-124
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 124 (Diogenés Laertios X, 124)
    cesky: "Zvykej si na myšlenku, že smrt se nás netýká. Všechno dobré i zlé je totiž ve vnímání, a smrt je ztráta vnímání."
    original: "Συνέθιζε δὲ ἐν τῷ νομίζειν μηδὲν πρὸς ἡμᾶς εἶναι τὸν θάνατον· ἐπεὶ πᾶν ἀγαθὸν καὶ κακὸν ἐν αἰσθήσει· στέρησις δέ ἐστιν αἰσθήσεως ὁ θάνατος."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); συνέθιζε = zvykej si: Epikúros žádá cvik, ne jen souhlas"
    zdroj: dl-x-122
  - id: menoikeus-124-touha
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 124 (Diogenés Laertios X, 124)
    cesky: "Kdo správně pochopí, že smrt se nás netýká, tomu je smrtelný život k radosti: nepřidá mu to nekonečný čas, ale zbaví ho to touhy po nesmrtelnosti."
    original: "ὅθεν γνῶσις ὀρθὴ τοῦ μηθὲν εἶναι πρὸς ἡμᾶς τὸν θάνατον ἀπολαυστὸν ποιεῖ τὸ τῆς ζωῆς θνητόν, οὐκ ἄπειρον προστιθεῖσα χρόνον ἀλλὰ τὸν τῆς ἀθανασίας ἀφελομένη πόθον."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); volněji"
    zdroj: dl-x-122
  - id: menoikeus-125
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 125 (Diogenés Laertios X, 125)
    cesky: "Smrt, to nejděsivější ze všeho zlého, se nás tedy netýká: dokud jsme tu my, smrt tu není, a když je tu smrt, nejsme tu už my."
    original: "τὸ φρικωδέστατον οὖν τῶν κακῶν ὁ θάνατος οὐθὲν πρὸς ἡμᾶς, ἐπειδή περ ὅταν μὲν ἡμεῖς ὦμεν, ὁ θάνατος οὐ πάρεστιν· ὅταν δʼ ὁ θάνατος παρῇ, τόθʼ ἡμεῖς οὐκ ἐσμέν."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-122
  - id: menoikeus-125-cekani
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 125 (Diogenés Laertios X, 125)
    cesky: "Co netrápí, když je to tady, trápí naprázdno, když se na to čeká."
    original: "ὃ γὰρ παρὸν οὐκ ἐνοχλεῖ, προσδοκώμενον κενῶς λυπεῖ."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-122
  - id: menoikeus-126
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 126 (Diogenés Laertios X, 126)
    cesky: "Jako si z jídla nevybírá za každou cenu to nejvíc, ale to nejlepší, tak ani z času nesklízí ten nejdelší, ale ten nejpříjemnější."
    original: "ὥσπερ δὲ τὸ σιτίον οὐ τὸ πλεῖον πάντως ἀλλὰ τὸ ἥδιστον αἱρεῖται, οὕτω καὶ χρόνον οὐ τὸν μήκιστον ἀλλὰ τὸν ἥδιστον καρπίζεται."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); podmětem je moudrý člověk"
    zdroj: dl-x-122
  - id: kd-2
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 2 (Diogenés Laertios X, 139)
    cesky: "Smrt se nás netýká. Co se rozpadlo, nevnímá, a co nevnímá, se nás netýká."
    original: "Ὁ θάνατος οὐδὲν πρὸς ἡμᾶς· τὸ γὰρ διαλυθὲν ἀναισθητεῖ· τὸ δʼ ἀναισθητοῦν οὐδὲν πρὸς ἡμᾶς."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-139
  - id: kd-19
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 19 (Diogenés Laertios X, 145)
    cesky: "Nekonečný čas v sobě má stejně slasti jako čas omezený, když člověk její meze změří rozumem."
    original: "Ὁ ἄπειρος χρόνος ἴσην ἔχει τὴν ἡδονὴν καὶ ὁ πεπερασμένος, ἐάν τις αὐτῆς τὰ πέρατα καταμετρήσῃ τῷ λογισμῷ."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-139
  - id: vs-31
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "31"
    cesky: "Proti všemu ostatnímu si lze opatřit bezpečí. Kvůli smrti ale my lidé všichni bydlíme ve městě bez hradeb."
    original: "Πρὸς μὲν τἆλλα δυνατὸν ἀσφάλειαν πορίσασθαι, χάριν δὲ θανάτου πάντες ἄνθρωποι πόλιν ἀτείχιστον οἰκοῦμεν."
    preklad:
      druh: vlastni
      podle: "řecký text (von der Mühll); sbírka výroků Epikúrovy školy, u jednotlivých vět není autorství jisté"
    zdroj: gnomologium-vaticanum
  - id: vs-66
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "66"
    cesky: "Soucit s přáteli neprojevujme nářkem, ale tím, že se o ně staráme."
    original: "Συμπαθῶμεν τοῖς φίλοις οὐ θρηνοῦντες ἀλλὰ φροντίζοντες."
    preklad:
      druh: vlastni
      podle: "řecký text (von der Mühll)"
    zdroj: gnomologium-vaticanum
  # Cesta 8: Lucretius
  - id: lucretius-iii-832
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 832–841
    cesky: "Jako jsme v čase, který minul, necítili nic zlého, když se ze všech stran valili do boje Punové … tak až nebudeme … nebude se nám, kteří tu tehdy nebudeme, moci stát vůbec nic a nic námi nepohne."
    original: "et vel ut ante acto nihil tempore sensimus aegri, ad confligendum venientibus undique Poenis … sic, ubi non erimus … scilicet haud nobis quicquam, qui non erimus tum, accidere omnino poterit sensumque movere"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); zkráceno, próza místo veršů"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-972
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 972–977
    cesky: "Ohlédni se, jak nic pro nás neznamenal ten odvěký čas, který uplynul, než jsme se narodili. V něm nám příroda nastavuje zrcadlo času, který přijde po naší smrti. Je tam vidět něco hrozného? Zdá se tam něco smutné? Není to klidnější než každý spánek?"
    original: "respice item quam nil ad nos ante acta vetustas temporis aeterni fuerit, quam nascimur ante. hoc igitur speculum nobis natura futuri temporis exponit post mortem denique nostram. numquid ibi horribile apparet, num triste videtur quicquam, non omni somno securius exstat?"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); próza místo veršů"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-972-zrcadlo
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 972–977
    cesky: "Ohlédni se, jak nic pro nás neznamenal ten odvěký čas, který uplynul, než jsme se narodili. V něm nám příroda nastavuje zrcadlo času, který přijde po naší smrti. Je tam vidět něco hrozného? Zdá se tam něco smutné?"
    original: "respice item quam nil ad nos ante acta vetustas temporis aeterni fuerit, quam nascimur ante. hoc igitur speculum nobis natura futuri temporis exponit post mortem denique nostram. numquid ibi horribile apparet, num triste videtur quicquam"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); próza místo veršů; kratší podoba citátu lucretius-iii-972 pro cestu 8: bez poslední otázky („Není to klidnější než každý spánek?“), viz podkladový list celku 6, Citlivá místa"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-894
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 894–899
    cesky: "‚Už tě nepřivítá veselý dům ani nejlepší z žen, už ti nepoběží naproti milé děti, aby ti ukradly první polibek, a nedotknou se tvého srdce tichou něhou. … Ubohému ti jediný nepřátelský den,‘ říkají, ‚vzal všechny dary života.‘"
    original: "'Iam iam non domus accipiet te laeta neque uxor optima, nec dulces occurrent oscula nati praeripere et tacita pectus dulcedine tangent. … misero misere' aiunt 'omnia ademit una dies infesta tibi tot praemia vitae.'"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); slova truchlících, která básník uvádí a pak odmítá; věta před citátem to musí říct"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-900
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 900–901
    cesky: "Nedodají k tomu: ‚A po ničem z toho se ti už nestýská.‘"
    original: "illud in his rebus non addunt 'nec tibi earum iam desiderium rerum super insidet una.'"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL)"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-938
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 938
    cesky: "Proč neodejdeš jako host, který se života nasytil?"
    original: "cur non ut plenus vitae conviva recedis"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); otázku klade zosobněná Příroda člověku, kterému byl život milý; verš 939 ho oslovuje „blázne“"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-971
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 971
    cesky: "Život nedostává nikdo do vlastnictví, všichni jen do užívání."
    original: "vitaque mancipio nulli datur, omnibus usu"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL)"
    zdroj: lucretius-iii-830
  # Cesta 8: Seneca
  - id: seneca-ep-54-3
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 3
    cesky: "Ani když jsem se dusil, nepřestal jsem hledat úlevu v radostných a statečných myšlenkách."
    original: "Ego vero et in ipsa suffocatione non desii cogitationibus laetis ac fortibus adquiescere."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-54-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 4
    cesky: "Smrt je nebýt. Jaké to je, už vím: po mně bude to, co bylo přede mnou."
    original: "Mors est non esse; id quale sit, iam scio. Hoc erit post me, quod ante me fuit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-54-5
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 5
    cesky: "Neřekl bys, že je vrchol hlouposti myslet si, že lampě je hůř, když zhasla, než předtím, než ji rozsvítili? I nás zhášejí a rozsvěcují. V čase mezi tím něco zakoušíme; z obou stran je hluboký klid."
    original: "Rogo, non stultissimum dicas, si quis existimet lucernae peius esse, cum extincta est, quam antequam accenditur? Nos quoque et extinguimur et accendimur; medio illo tempore aliquid patimur, utrimque vero alta securitas est."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-54-5-lampa
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 5
    cesky: "Neřekl bys, že je vrchol hlouposti myslet si, že lampě je hůř, když zhasla, než předtím, než ji rozsvítili? I nás zhášejí a rozsvěcují."
    original: "Rogo, non stultissimum dicas, si quis existimet lucernae peius esse, cum extincta est, quam antequam accenditur? Nos quoque et extinguimur et accendimur"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); kratší podoba citátu seneca-ep-54-5 pro cestu 8: bez závěru o „hlubokém klidu“ z obou stran, viz podkladový list celku 6, Citlivá místa"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-24-18
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 18
    cesky: "Smrt nás buď stráví, nebo svlékne. Jestli nás propustí, zbývá nám to lepší a břemeno je pryč. Jestli nás stráví, nezbývá nic: dobré i zlé je odklizeno stejně."
    original: "Mors nos aut consumit aut exuit. Emissis meliora restant onere detracto, consumptis nihil restat, bona pariter malaque submota sunt."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-24-20
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 20
    cesky: "Umíráme každý den. Každý den nám totiž ubývá kus života, a i když rosteme, život se krátí."
    original: "Cotidie morimur; cotidie enim demitur aliqua pars vitae, et tunc quoque, cum crescimus, vita decrescit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); Seneca tu Luciliovi připomíná jeho vlastní úvahu (24, 19)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-24-20-hodiny
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 20
    cesky: "Vodní hodiny nevyprázdní poslední kapka, ale všechno, co odteklo před ní. Stejně tak poslední hodina, ve které přestáváme být, smrt nedělá sama; jen ji dokončuje."
    original: "Quemadmodum clepsydram non extremum stillicidium exhaurit, sed quicquid ante defluxit, sic ultima hora, qua esse desinimus, non sola mortem facit, sed sola consummat"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-26-6
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 26, 6
    cesky: "Řeč je totiž odvážná i u těch nejbojácnějších."
    original: "Est enim oratio etiam timidissimis audax."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o sobě: jestli svá statečná slova myslí vážně, ukáže až konec"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-30-7
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 30, 7
    cesky: "Vím, že se to říkalo často a často se to ještě říkat bude. Nepomáhalo mi to ale tolik, když jsem to četl, ani když jsem to slyšel od lidí, kteří tvrdili, že se není čeho bát, a sami byli od toho, čeho se bát nemáme, daleko."
    original: "Haec ego scio et saepe dicta et saepe dicenda, sed neque cum legerem, aeque mihi profuerunt, neque cum audirem iis dicentibus, qui negabant timenda, a quorum metu aberant"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o argumentu, že co nebudeme cítit, se nemáme bát"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-30-17
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 30, 17
    cesky: "Nebojíme se smrti, ale myšlenky na smrt."
    original: "Non mortem timemus, sed cogitationem mortis."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-61-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 61, 4
    cesky: "O tom, jestli jsme žili dost, nerozhodují roky ani dny, ale mysl."
    original: "Ut satis vixerimus, nec anni nec dies faciunt, sed animus."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-63-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 63, 1
    cesky: "Když ztratíme přítele, ať oči nejsou suché, ale ať ani nepřetékají."
    original: "Nec sicci sint oculi amisso amico nec fluant."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-63-7
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 63, 7
    cesky: "Měl jsem je, jako bych je měl ztratit; ztratil jsem je, jako bych je pořád měl."
    original: "Habui enim illos tamquam amissurus, amisi tamquam habeam."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o zemřelých přátelích"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-63-14
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 63, 14
    cesky: "Tohle ti píšu já, který jsem svého drahého Annaea Serena oplakával tak bez míry, že patřím, ač o to nejméně stojím, k příkladům lidí, které bolest přemohla."
    original: "Haec tibi scribo is, qui Annaeum Serenum, carissimum mihi, tam inmodice flevi, ut, quod minime velim, inter exempla sim eorum, quos dolor vicit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-99-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 99, 4
    cesky: "Čas, který minul, je náš, a nic není na bezpečnějším místě než to, co bylo."
    original: "Nostrum est, quod praeteriit, tempus nec quicquam est loco tutiore quam quod fuit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-99-15
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 99, 15
    cesky: "To není ctnost, to je nelidskost: dívat se na pohřeb svých blízkých stejnýma očima jako na ně samé a nepohnout se, když nám je berou."
    original: "Inhumanitas est ista, non virtus, funera suorum isdem oculis, quibus ipsos, videre nec commoveri ad primam familiarium divulsionem."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); pořadí vět obráceno; dopis jinak otce, kterému zemřel malý syn, tvrdě kárá"
    zdroj: seneca-epistulae-smrt
  # Cesta 8: Cicero, Sókratés, Platón, Aristotelés
  - id: cicero-fin-ii-94
    osoba: cicero
    autor: Cicero
    dilo: O nejvyšším dobru a zlu
    misto: II, 94
    cesky: "Vidím přece bolesti velké a přitom pořádně dlouhé."
    original: "video enim et magnos et eosdem bene longinquos dolores"
    preklad:
      druh: vlastni
      podle: "latinský text (Schiche); proti Epikúrově větě, že velká bolest je krátká a dlouhá lehká"
    zdroj: cicero-de-finibus-ii
  - id: cicero-fin-ii-98
    osoba: cicero
    autor: Cicero
    dilo: O nejvyšším dobru a zlu
    misto: II, 98
    cesky: "Slyším hlas filozofa, Epikúre, ale zapomněl jsi, co bys měl říkat."
    original: "Audio equidem philosophi vocem, Epicure, sed quid tibi dicendum sit oblitus es."
    preklad:
      druh: vlastni
      podle: "latinský text (Schiche); o Epikúrově dopise z posledního dne"
    zdroj: cicero-de-finibus-ii
  - id: obrana-29a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 29a
    cesky: "Bát se smrti, mužové, není nic jiného než zdát se moudrým a nebýt: je to zdát se, že vím, co nevím."
    original: "τὸ γάρ τοι θάνατον δεδιέναι, ὦ ἄνδρες, οὐδὲν ἄλλο ἐστὶν ἢ δοκεῖν σοφὸν εἶναι μὴ ὄντα· δοκεῖν γὰρ εἰδέναι ἐστὶν ἃ οὐκ οἶδεν."
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera"
    zdroj: platon-obrana
  - id: obrana-40c
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 40c
    cesky: "Být mrtvý je jedno z dvojího: buď je to, jako by mrtvý nebyl nic a nic nevnímal, nebo je to, jak se vypráví, jakási změna a přestěhování duše odsud na jiné místo."
    original: "δυοῖν γὰρ θάτερόν ἐστιν τὸ τεθνάναι· ἢ γὰρ οἷον μηδὲν εἶναι μηδὲ αἴσθησιν μηδεμίαν μηδενὸς ἔχειν τὸν τεθνεῶτα, ἢ κατὰ τὰ λεγόμενα μεταβολή τις τυγχάνει οὖσα καὶ μετοίκησις τῇ ψυχῇ τοῦ τόπου τοῦ ἐνθένδε εἰς ἄλλον τόπον."
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; Sókratés mluví k soudcům, kteří hlasovali pro něj"
    zdroj: platon-obrana
  - id: obrana-41d
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 41d
    cesky: "Dobrému člověku se nemůže stát nic zlého, ani když žije, ani když zemře."
    original: "οὐκ ἔστιν ἀνδρὶ ἀγαθῷ κακὸν οὐδὲν οὔτε ζῶντι οὔτε τελευτήσαντι"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera"
    zdroj: platon-obrana
  - id: obrana-42a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 42a
    cesky: "Ale už je čas jít: já půjdu zemřít, vy žít. Kdo z nás jde za lepším, neví nikdo kromě boha."
    original: "ἀλλὰ γὰρ ἤδη ὥρα ἀπιέναι, ἐμοὶ μὲν ἀποθανουμένῳ, ὑμῖν δὲ βιωσομένοις· ὁπότεροι δὲ ἡμῶν ἔρχονται ἐπὶ ἄμεινον πρᾶγμα, ἄδηλον παντὶ πλὴν ἢ τῷ θεῷ."
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; poslední věta Obrany"
    zdroj: platon-obrana
  - id: faidon-107c
    osoba: platon
    autor: Platón
    dilo: Faidón
    misto: 107c
    cesky: "Je-li duše nesmrtelná, potřebuje péči nejen pro ten čas, kterému říkáme život, ale pro čas všechen."
    original: "εἴπερ ἡ ψυχὴ ἀθάνατος, ἐπιμελείας δὴ δεῖται οὐχ ὑπὲρ τοῦ χρόνου τούτου μόνον ἐν ᾧ καλοῦμεν τὸ ζῆν, ἀλλ’ ὑπὲρ τοῦ παντός"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés v posledním dni života"
    zdroj: platon-faidon-perseus
  - id: faidon-114d
    osoba: platon
    autor: Platón
    dilo: Faidón
    misto: 114d
    cesky: "Tvrdit, že je to přesně tak, jak jsem to vylíčil, se na rozumného člověka nesluší. Že je to ale s našimi dušemi takhle nebo nějak podobně, když se přece duše ukazuje jako nesmrtelná, tomu se podle mě sluší věřit a stojí za to se toho odvážit. Je to krásné riziko."
    original: "τὸ μὲν οὖν ταῦτα διισχυρίσασθαι οὕτως ἔχειν ὡς ἐγὼ διελήλυθα, οὐ πρέπει νοῦν ἔχοντι ἀνδρί· ὅτι μέντοι ἢ ταῦτ᾽ ἐστὶν ἢ τοιαῦτ’ ἄττα περὶ τὰς ψυχὰς ἡμῶν καὶ τὰς οἰκήσεις, ἐπείπερ ἀθάνατόν γε ἡ ψυχὴ φαίνεται οὖσα, τοῦτο καὶ πρέπειν μοι δοκεῖ καὶ ἄξιον κινδυνεῦσαι οἰομένῳ οὕτως ἔχειν — καλὸς γὰρ ὁ κίνδυνος"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés po vyprávění o osudu duší; „a jejich příbytky“ vynecháno"
    zdroj: platon-faidon-perseus
  - id: etika-1115a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: III, 6, 1115a26–27
    cesky: "Nejstrašnější je smrt. Je to totiž hranice a zdá se, že pro mrtvého už není nic dobré ani zlé."
    original: "φοβερώτατον δʼ ὁ θάνατος· πέρας γάρ, καὶ οὐδὲν ἔτι τῷ τεθνεῶτι δοκεῖ οὔτʼ ἀγαθὸν οὔτε κακὸν εἶναι."
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater); z výkladu o statečnosti"
    zdroj: aristoteles-etika-smrt
  - id: etika-1117b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: III, 9, 1117b10–13
    cesky: "Čím úplnější je jeho ctnost a čím je šťastnější, tím víc ho smrt bude bolet. Takovému člověku totiž nejvíc stojí za to žít, a on ví, že přichází o největší dobra."
    original: "ὅσῳ ἂν μᾶλλον τὴν ἀρετὴν ἔχῃ πᾶσαν καὶ εὐδαιμονέστερος ᾖ, μᾶλλον ἐπὶ τῷ θανάτῳ λυπήσεται· τῷ τοιούτῳ γὰρ μάλιστα ζῆν ἄξιον, καὶ οὗτος μεγίστων ἀγαθῶν ἀποστερεῖται εἰδώς"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater); řeč je o statečném člověku v boji"
    zdroj: aristoteles-etika-smrt
  - id: etika-1117b-bolest
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: III, 9, 1117b10–11
    cesky: "Čím úplnější je jeho ctnost a čím je šťastnější, tím víc ho smrt bude bolet."
    original: "ὅσῳ ἂν μᾶλλον τὴν ἀρετὴν ἔχῃ πᾶσαν καὶ εὐδαιμονέστερος ᾖ, μᾶλλον ἐπὶ τῷ θανάτῳ λυπήσεται"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater); řeč je o statečném člověku v boji; kratší podoba citátu etika-1117b pro cestu 8: bez věty „takovému člověku nejvíc stojí za to žít“ (obráceně říká studentovi, kterému je zle, že jeho život stojí za to míň), viz záznam revize celku 6 z 9. 10. 2026, nález 2"
    zdroj: aristoteles-etika-smrt
  - id: etika-1177b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 7, 1177b31–34
    cesky: "Nemáme poslouchat ty, kdo radí, ať člověk myslí na lidské věci a smrtelník na smrtelné. Máme se, nakolik to jde, stávat nesmrtelnými a dělat všechno pro to, abychom žili podle toho nejlepšího, co v nás je."
    original: "οὐ χρὴ δὲ κατὰ τοὺς παραινοῦντας ἀνθρώπινα φρονεῖν ἄνθρωπον ὄντα οὐδὲ θνητὰ τὸν θνητόν, ἀλλʼ ἐφʼ ὅσον ἐνδέχεται ἀθανατίζειν καὶ πάντα ποιεῖν πρὸς τὸ ζῆν κατὰ τὸ κράτιστον τῶν ἐν αὑτῷ"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater)"
    zdroj: aristoteles-etika-smrt
  # Velká otázka 3: Epiktétos a Marcus Aurelius
  - id: rozpravy-i-6-19
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 6, 19 a 22
    cesky: "Člověka ale bůh uvedl na svět jako diváka sebe i svých děl, a nejen jako diváka, ale i jako jejich vykladače. … Hleďte tedy, ať nezemřete, aniž jste to viděli."
    original: "τὸν δʼ ἄνθρωπον θεατὴν εἰσήγαγεν αὐτοῦ τε καὶ τῶν ἔργων τῶν αὐτοῦ, καὶ οὐ μόνον θεατήν, ἀλλὰ καὶ ἐξηγητὴν αὐτῶν. … ὁρᾶτε οὖν, μὴ ἀθέατοι τούτων ἀποθάνητε."
    preklad:
      druh: vlastni
      podle: "řecký text (Schenkl) a anglický překlad z PerseusDL; podmět „bůh“ doplněn ze souvislosti"
    zdroj: epiktetos-rozpravy
  - id: hovory-iv-17
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: IV, 17
    cesky: "Nežij, jako bys měl žít deset tisíc let. Nevyhnutelné nad tebou visí. Dokud žiješ, dokud to jde, staň se dobrým."
    original: "Μὴ ὡς μύρια μέλλων ἔτη ζῆν. τὸ χρεὼν ἐπήρτηται· ἕως ζῇς, ἕως ἔξεστιν, ἀγαθὸς γενοῦ."
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold)"
    zdroj: marcus-hovory
  - id: hovory-ii-14
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: II, 14
    cesky: "Nikdo neztrácí jiný život než ten, který právě žije, a nežije jiný než ten, který ztrácí."
    original: "οὐδεὶς ἄλλον ἀποβάλλει βίον ἢ τοῦτον ὃν ζῇ, οὐδὲ ἄλλον ζῇ ἢ ὃν ἀποβάλλει"
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold)"
    zdroj: marcus-hovory
  - id: hovory-xii-36
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: XII, 36
    cesky: "V životě jsou ale i tři dějství celá hra. … Odejdi tedy smířený: i ten, kdo tě propouští, je smířený."
    original: "ἐν μέντοι τῷ βίῳ τὰ τρία ὅλον τὸ δρᾶμά ἐστι. … ἄπιθι οὖν ἵλεως· καὶ γὰρ ὁ ἀπολύων ἵλεως."
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold); poslední zápis Hovorů: herec namítá, že neodehrál pět dějství, jen tři"
    zdroj: marcus-hovory
  # Celek 7 (P6, 9. 10. 2026). Převody jsou vlastní, z řeckého nebo latinského textu uvedeného u pramene.
  # U zlomků předsókratiků je v údaji číslo podle Dielse a Kranze a autor, u kterého se zlomek dochoval.
  - id: herakleitos-b12
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B12
    misto: u Eusebia, Příprava na evangelium XV, 20
    cesky: "Na ty, kdo vstupují do týchž řek, tečou jiné a zase jiné vody."
    original: "ποταμοῖσι τοῖσιν αὐτοῖσιν ἐμβαίνουσιν ἕτερα καὶ ἕτερα ὕδατα ἐπιρρεῖ"
    preklad:
      druh: vlastni
      podle: "řecký text (Dindorf); číslo zlomku DK 22 B12; Eusebios (4. stol. n. l.) opisuje z Areia Didyma a ten z Kleantha; podle hesla SEP jediné znění o řece s rysy Hérakleitova jazyka"
    zdroj: eusebios-pe-xv-20
  - id: herakleitos-b49a
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B49a
    misto: u Hérakleita alegorika, Homérské otázky 24
    cesky: "Do týchž řek vstupujeme i nevstupujeme, jsme i nejsme."
    original: "ποταμοῖς τοῖς αὐτοῖς ἐμβαίνομέν τε καὶ οὐκ ἐμβαίνομεν, εἶμέν τε καὶ οὐκ εἶμεν"
    preklad:
      druh: vlastni
      podle: "řecký text (Mehler); DK 22 B49a; pravost sporná (podle hesla SEP odporuje B12), v atlasu jen s uvozením „připisuje se mu“ nebo „pozdější autor ho cituje takto“; první půlku má latinsky Seneca (Dopisy 58, 23)"
    zdroj: herakleitos-alegorik
  - id: kratylos-402a
    osoba: platon
    autor: Platón
    dilo: Kratylos
    misto: 402a
    cesky: "Hérakleitos tuším říká, že všechno je v pohybu a nic nezůstává. Přirovnává věci k proudu řeky a říká, že dvakrát do téže řeky nevstoupíš."
    original: "λέγει που Ἡράκλειτος ὅτι πάντα χωρεῖ καὶ οὐδὲν μένει, καὶ ποταμοῦ ῥοῇ ἀπεικάζων τὰ ὄντα λέγει ὡς δὶς ἐς τὸν αὐτὸν ποταμὸν οὐκ ἂν ἐμβαίης"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés; DK 22 A6 (svědectví, ne zlomek); λέγει που = „říká někde“, „tuším říká“"
    zdroj: platon-kratylos
  - id: plutarchos-de-e-392b
    osoba: plutarchos
    autor: Plútarchos
    dilo: O delfském E
    misto: 392b
    cesky: "Do téže řeky totiž podle Hérakleita dvakrát vstoupit nelze."
    original: "ποταμῷ γὰρ οὐκ ἔστιν ἐμβῆναι δὶς τῷ αὐτῷ καθʼ Ἡράκλειτον"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); mluví Ammónios; DK 22 B91; nejspíš parafráze po Platónovi a Aristotelovi, ne Hérakleitova slova"
    zdroj: plutarchos-de-e
  - id: metafyzika-1010a-kratylos
    osoba: aristoteles
    autor: Aristotelés
    dilo: Metafyzika
    misto: IV, 5, 1010a12–15
    cesky: "Kratylos nakonec soudil, že se nemá říkat nic, a jen hýbal prstem. Hérakleitovi vytýkal, že řekl, že do téže řeky nelze vstoupit dvakrát: sám soudil, že ani jednou."
    original: "ὃς τὸ τελευταῖον οὐθὲν ᾤετο δεῖν λέγειν ἀλλὰ τὸν δάκτυλον ἐκίνει μόνον, καὶ Ἡρακλείτῳ ἐπετίμα εἰπόντι ὅτι δὶς τῷ αὐτῷ ποταμῷ οὐκ ἔστιν ἐμβῆναι· αὐτὸς γὰρ ᾤετο οὐδʼ ἅπαξ"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka; jméno Kratylos doplněno z předchozí věty"
    zdroj: aristoteles-metafyzika-zmena
  - id: metafyzika-1010a-zbyva
    osoba: aristoteles
    autor: Aristotelés
    dilo: Metafyzika
    misto: IV, 5, 1010a18–19
    cesky: "Co něco ztrácí, má ještě něco z toho, co ztrácí, a z toho, co vzniká, už něco musí být."
    original: "τό τε γὰρ ἀποβάλλον ἔχει τι τοῦ ἀποβαλλομένου, καὶ τοῦ γιγνομένου ἤδη ἀνάγκη τι εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka; Aristotelova odpověď těm, kdo se hlásí k Hérakleitovi"
    zdroj: aristoteles-metafyzika-zmena
  - id: herakleitos-b101
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B101
    misto: u Plútarcha, Proti Kólótovi 1118c
    cesky: "Hledal jsem sám sebe."
    original: "ἐδιζησάμην ἐμεωυτόν"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis), bez Plútarchova vloženého φησίν („říká“); DK 22 B101; δίζημαι = hledat, pátrat, vyptávat se; Diogenés Laertios IX, 5 totéž v nepřímé řeči"
    zdroj: plutarchos-kolotes
  - id: herakleitos-b45
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B45
    misto: u Diogena Laertia IX, 7
    cesky: "Hranice duše nenajdeš, i kdybys prošel každou cestu: tak hlubokou má míru."
    original: "ψυχῆς πείρατα ἰὼν οὐκ ἂν ἐξεύροιο, πᾶσαν ἐπιπορευόμενος ὁδόν· οὕτω βαθὺν λόγον ἔχει"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; DK 22 B45; λόγος tu převádím „míra“ (jinak řeč, důvod, poměr)"
    zdroj: dl-ix-1
  - id: herakleitos-b40
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B40
    misto: u Diogena Laertia IX, 1
    cesky: "Mnoho vědět ještě nenaučí rozumu. Jinak by to naučilo Hésioda a Pýthagoru a také Xenofana a Hekataia."
    original: "πολυμαθίη νόον οὐ διδάσκει· Ἡσίοδον γὰρ ἂν ἐδίδαξε καὶ Πυθαγόρην, αὖτίς τε Ξενοφάνεά τε καὶ Ἑκαταῖον"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; DK 22 B40"
    zdroj: dl-ix-1
  - id: herakleitos-b121
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B121
    misto: u Diogena Laertia IX, 2
    cesky: "Efesané by zasloužili, aby všichni dospělí do jednoho zemřeli a město nechali nedospělým. Vyhnali přece Hermodóra, nejschopnějšího z nich, a řekli: Nikdo z nás ať není nejschopnější. A když už takový je, ať je jinde a mezi jinými."
    original: "ἄξιον Ἐφεσίοις ἡβηδὸν ἀποθανεῖν πᾶσι καὶ τοῖς ἀνήβοις τὴν πόλιν καταλιπεῖν, οἵτινες Ἑρμόδωρον ἄνδρα ἑωυτῶν ὀνήιστον ἐξέβαλον λέγοντες, Ἡμέων μηδὲ εἷς ὀνήιστος ἔστω· εἰ δέ τις τοιοῦτος, ἄλλῃ τε καὶ μετʼ ἄλλων"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; DK 22 B121, celý zlomek; ἡβηδόν = všichni dospělí, ἄνηβοι = nedospělí, ὀνήιστος doslova nejprospěšnější. Diogenés má sloveso „zemřít“ (ἀποθανεῖν); že jiní autoři uvádějí ostřejší, vím jen z literatury. Hned za zlomkem Diogenés vypráví, že Hérakleitos odmítl psát Efesanům zákony a hrál s dětmi v Artemidině chrámu"
    zdroj: dl-ix-1
  - id: herakleitos-b51
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B51
    misto: u Hippolyta, Vyvrácení všech herezí IX, 9
    cesky: "Nechápou, jak se to, co se rozchází, samo se sebou shoduje: je to spojení napjaté proti sobě jako u luku a lyry."
    original: "οὐ ξυνίασιν ὅκως διαφερόμενον ἑωυτῷ ὁμολογέει· παλίντροπος ἁρμονίη ὅκωσπερ τόξου καὶ λύρης"
    preklad:
      druh: vlastni
      podle: "řecký text (Duncker a Schneidewin); DK 22 B51; παλίντροπος = obrácený zpět; ἁρμονίη = spojení, sladění"
    zdroj: hippolytos-ix
  - id: herakleitos-b60
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B60
    misto: u Hippolyta, Vyvrácení všech herezí IX, 10
    cesky: "Cesta nahoru a dolů je jedna a táž."
    original: "ὁδὸς ἄνω κάτω μίη καὶ ὡυτή"
    preklad:
      druh: vlastni
      podle: "řecký text (Duncker a Schneidewin: μίη; DK 22 B60 tiskne μία)"
    zdroj: hippolytos-ix
  - id: herakleitos-b61
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B61
    misto: u Hippolyta, Vyvrácení všech herezí IX, 10
    cesky: "Moře je voda nejčistší i nejšpinavější: rybám k pití a k životu, lidem nepitná a zhoubná."
    original: "θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον, ἰχθῦσι μὲν πότιμον καὶ σωτήριον, ἀνθρώποις δὲ ἄποτον καὶ ὀλέθριον"
    preklad:
      druh: vlastni
      podle: "řecký text (Duncker a Schneidewin), bez Hippolytova vloženého φησίν („říká“); DK 22 B61"
    zdroj: hippolytos-ix
  - id: herakleitos-b53
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B53
    misto: u Hippolyta, Vyvrácení všech herezí IX, 9
    cesky: "Válka je všemu otcem a všemu králem. Jedny ukázala jako bohy, druhé jako lidi, z jedněch udělala otroky, z druhých svobodné."
    original: "Πόλεμος πάντων μὲν πατήρ ἐστι, πάντων δὲ βασιλεύς, καὶ τοὺς μὲν θεοὺς ἔδειξε τοὺς δὲ ἀνθρώπους, τοὺς μὲν δούλους ἐποίησε τοὺς δὲ ἐλευθέρους"
    preklad:
      druh: vlastni
      podle: "řecký text (Duncker a Schneidewin); DK 22 B53; πόλεμος = válka, boj (slovo je mužského rodu, proto otec a král); πάντων = všeho i všech"
    zdroj: hippolytos-ix
  - id: herakleitos-b52
    osoba: herakleitos
    autor: Hérakleitos
    dilo: zlomek B52
    misto: u Hippolyta, Vyvrácení všech herezí IX, 9
    cesky: "Věk je dítě, které si hraje a táhne kameny po desce. Království patří dítěti."
    original: "Αἰὼν παῖς ἐστι παίζων, πεττεύων· παιδὸς ἡ βασιληΐη"
    preklad:
      druh: vlastni
      podle: "řecký text (Duncker a Schneidewin); DK 22 B52; αἰών = věk, čas života; πεττεύων = kdo hraje deskovou hru s kameny; výklad zlomku je sporný; rezerva ke scéně s kostkami"
    zdroj: hippolytos-ix
  - id: dl-ix-3-kostky
    osoba: herakleitos
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 3
    cesky: "Co se divíte, vy ničemové? Není to lepší než s vámi spravovat obec?"
    original: "τί, ὦ κάκιστοι, θαυμάζετε; ἢ οὐ κρεῖττον τοῦτο ποιεῖν ἢ μεθʼ ὑμῶν πολιτεύεσθαι;"
    preklad:
      druh: vlastni
      podle: "řecký text (bez vloženého εἶπεν, „řekl“) a anglický překlad R. D. Hickse; tradovaný příběh: Hérakleitos hraje s dětmi kostky u Artemidina chrámu a Efesané stojí kolem"
    zdroj: dl-ix-1
  - id: dl-ii-22-potapec
    osoba: sokrates
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: II, 22
    cesky: "Čemu jsem porozuměl, je znamenité; a myslím, že i to, čemu jsem neporozuměl. Jen by to chtělo délského potápěče."
    original: "ἃ μὲν συνῆκα, γενναῖα· οἶμαι δὲ καὶ ἃ μὴ συνῆκα· πλὴν Δηλίου γέ τινος δεῖται κολυμβητοῦ"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; tradovaný příběh („říká se“): Eurípidés dal Sókratovi Hérakleitův spis a ptal se, co o něm soudí; v IX, 12 se výrok o potápěči připisuje jakémusi Kratétovi"
    zdroj: dl-ix-1
  - id: parmenides-b1-brana
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B1, 11 (u Sexta Empeirika)
    cesky: "Tam stojí brána cest Noci a Dne."
    original: "ἔνθα πύλαι Νυκτός τε καὶ Ἤματός εἰσι κελεύθων"
    preklad:
      druh: vlastni
      podle: "řecký text (Mutschmann); DK 28 B1; Proti učencům VII, 111"
    zdroj: sextos-m-vii-111
  - id: parmenides-b1-bohyne
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B1, 22–23 (u Sexta Empeirika)
    cesky: "A bohyně mě vlídně přijala, vzala mou pravou ruku do své a takto ke mně promluvila."
    original: "καί με θεὰ πρόφρων ὑπεδέξατο, χεῖρα δὲ χειρὶ δεξιτερὴν ἕλεν, ὧδε δʼ ἔπος φάτο καί με προσηύδα"
    preklad:
      druh: vlastni
      podle: "řecký text (Mutschmann); DK 28 B1; bohyně ho pak oslovuje „mladíku“ (ὦ κοῦρε)"
    zdroj: sextos-m-vii-111
  - id: parmenides-b1-vsechno
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B1, 28–30 (u Sexta Empeirika)
    cesky: "Máš se dozvědět všechno: neochvějné srdce přesvědčivé pravdy i mínění smrtelníků, na která není spolehnutí."
    original: "χρεὼ δέ σε πάντα πυθέσθαι ἠμὲν Ἀληθείης εὐπειθέος ἀτρεμὲς ἦτορ ἠδὲ βροτῶν δόξας, ταῖς οὐκ ἔνι πίστις ἀληθής"
    preklad:
      druh: vlastni
      podle: "řecký text (Mutschmann); DK 28 B1; mluví bohyně; totéž cituje Diogenés Laertios IX, 22 se čtením „dobře zaoblené pravdy“ (εὐκυκλέος)"
    zdroj: sextos-m-vii-111
  - id: parmenides-b2
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B2, 3–8 (u Simplikia)
    cesky: "Jedna cesta: že je a že nemůže nebýt. To je cesta přesvědčení, protože jde za pravdou. Druhá: že není a že nebýt musí. O té ti říkám, že je to stezka, ze které se nedá nic zvědět: co není, bys nepoznal ani nevyslovil."
    original: "ἡ μὲν ὅπως ἔστι τε καὶ ὡς οὐκ ἔστι μὴ εἶναι, πειθοῦς ἐστι κέλευθος (ἀληθείῃ γὰρ ὀπηδεῖ), ἡ δʼ ὡς οὐκ ἔστι τε καὶ ὡς χρεών ἐστι μὴ εἶναι, τὴν δή τοι φράζω παναπευθέα ἔμμεν ἀταρπόν· οὔτε γὰρ ἂν γνοίης τό γε μὴ ἐὸν (οὐ γὰρ ἀνυστόν) οὔτε φράσαις"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 116–117; DK 28 B2; mluví bohyně; vynecháno „neboť to nelze uskutečnit“"
    zdroj: simplikios-fyzika
  - id: parmenides-b6
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B6, 4–9 (u Simplikia)
    cesky: "Smrtelníci, kteří nic nevědí, bloudí o dvou hlavách. … Hluší i slepí, užaslí, zástupy bez úsudku, pro které být a nebýt je totéž i není totéž a jejichž cesta se ve všem obrací zpátky."
    original: "βροτοὶ εἰδότες οὐδὲν πλάττονται, δίκρανοι· … κωφοὶ ὁμῶς τυφλοί τε, τεθηπότες, ἄκριτα φῦλα, οἷς τὸ πέλειν τε καὶ οὐκ εἶναι ταὐτὸν νενόμισται κοὐ ταὐτόν, πάντων δὲ παλίντροπός ἐστι κέλευθος"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 117; DK 28 B6; zkráceno; mluví bohyně; verše, ve kterých část badatelů vidí narážku na Hérakleita (viz podklady)"
    zdroj: simplikios-fyzika
  - id: parmenides-b8-ted
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 5–6 (u Simplikia)
    cesky: "Nebylo a nebude, protože je teď, celé najednou, jedno, souvislé."
    original: "οὐδέ ποτʼ ἦν οὐδʼ ἔσται, ἐπεὶ νῦν ἔστιν ὁμοῦ πᾶν, ἕν, συνεχές"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 145; DK 28 B8; mluví bohyně o tom, co je"
    zdroj: simplikios-fyzika
  - id: parmenides-b8-jak
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 19–20 (u Simplikia)
    cesky: "Jak by mohlo to, co je, být až potom? Jak by mohlo vzniknout? Jestli vzniklo, není; a není, ani jestli teprve někdy má být."
    original: "πῶς δʼ ἂν ἔπειτα πέλοι τὸ ἐόν; πῶς δʼ ἄν κε γένοιτο; εἰ γὰρ ἔγεντʼ, οὐκ ἔστʼ, οὐδʼ εἴ ποτε μέλλει ἔσεσθαι"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 145; DK 28 B8"
    zdroj: simplikios-fyzika
  - id: parmenides-b8-zustava
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 29–30 (u Simplikia)
    cesky: "Totéž, v témž zůstává, samo o sobě leží, a tak tam pevně trvá."
    original: "ταὐτόν τʼ ἐν ταὐτῷ τε μένον καθʼ ἑαυτό τε κεῖται χοὔτως ἔμπεδον αὖθι μένει"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 146; DK 28 B8"
    zdroj: simplikios-fyzika
  - id: parmenides-b8-jmena
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 38–41 (u Simplikia)
    cesky: "Proto je jen jménem všechno, co si smrtelníci ustanovili ve víře, že je to pravda: vznikat a zanikat, být a nebýt, měnit místo a střídat jasnou barvu."
    original: "τῷ πάντʼ ὄνομ(α) ἔσται, ὅσσα βροτοὶ κατέθεντο πεποιθότες εἶναι ἀληθῆ, γίγνεσθαί τε καὶ ὄλλυσθαι, εἶναί τε καὶ οὐχί, καὶ τόπον ἀλλάσσειν διά τε χρόα φανὸν ἀμείβειν"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 146 (tam porušené ὠνόμασται; ὄνομ’ ἔσται podle DK 28 B8); stránka otázky 6 tato slova volně převádí v odpovědi hlasu"
    zdroj: simplikios-fyzika
  - id: parmenides-b8-mineni
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 50–52 (u Simplikia)
    cesky: "Tady končím spolehlivou řeč a myšlenku o pravdě. Odtud se uč mínění smrtelníků a poslouchej klamný řád mých slov."
    original: "ἐν τῷ σοι παύω πιστὸν λόγον ἠδὲ νόημα ἀμφὶς ἀληθείης· δόξας δʼ ἀπὸ τοῦδε βροτείας μάνθανε, κόσμον ἐμῶν ἐπέων ἀπατηλὸν ἀκούων"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 146 a 38; DK 28 B8; mluví bohyně"
    zdroj: simplikios-fyzika
  - id: parmenides-b8-predstihl
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 60–61 (u Simplikia)
    cesky: "Celé to uspořádání ti vykládám tak, jak se jeví, aby tě žádný lidský úsudek nikdy nepředstihl."
    original: "τόν σοι ἐγὼ διάκοσμον ἐοικότα πάντα φατίζω, ὡς οὐ μή ποτέ τίς σε βροτῶν γνώμη παρελάσσῃ"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels), Simplikios, Komentář k Fyzice, s. 39; DK 28 B8; ἐοικότα = podobné (pravdě), jak se jeví; mluví bohyně"
    zdroj: simplikios-fyzika
  - id: parmenides-b14
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B14 (u Plútarcha, Proti Kólótovi 1116a)
    cesky: "Svítí v noci, bloudí kolem Země, světlo cizí."
    original: "νυκτιφαὲς περὶ γαῖαν ἀλώμενον ἀλλότριον φῶς"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); DK 28 B14; verš o Měsíci z druhé části básně"
    zdroj: plutarchos-kolotes
  - id: plutarchos-kolotes-1114b
    osoba: plutarchos
    autor: Plútarchos
    dilo: Proti Kólótovi
    misto: 1114b
    cesky: "Parmenidés ale nezrušil oheň ani vodu ani sráz ani města, obývaná v Evropě a v Asii, jak tvrdí Kólótés."
    original: "ἀλλʼ ὅ γε Παρμενίδης οὔτε πῦρ ἀνῄρηκεν οὔτε ὕδωρ οὔτε κρημνὸν οὔτε πόλεις, ὥς φησι Κωλώτης, ἐν Εὐρώπῃ καὶ Ἀσίᾳ κατοικουμένας"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis)"
    zdroj: plutarchos-kolotes
  - id: sofistes-241d
    osoba: platon
    autor: Platón
    dilo: Sofistés
    misto: 241d
    cesky: "Nemysli si o mně, že se stávám něčím jako otcovrahem. … Budeme muset vyzkoušet řeč otce Parmenida a vynutit si, že to, co není, v jistém ohledu je, a to, co je, zase nějak není."
    original: "μή με οἷον πατραλοίαν ὑπολάβῃς γίγνεσθαί τινα. … τὸν τοῦ πατρὸς Παρμενίδου λόγον ἀναγκαῖον ἡμῖν ἀμυνομένοις ἔσται βασανίζειν, καὶ βιάζεσθαι τό τε μὴ ὂν ὡς ἔστι κατά τι καὶ τὸ ὂν αὖ πάλιν ὡς οὐκ ἔστι πῃ"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví host z Eleje; zkráceno"
    zdroj: platon-sofistes-parmenides
  - id: theaitetos-183e
    osoba: platon
    autor: Platón
    dilo: Theaitétos
    misto: 183e–184a
    cesky: "Parmenidés mi připadá, řečeno s Homérem, ctihodný a zároveň hrozný. Setkal jsem se s ním jako velmi mladý s velmi starým a zdálo se mi, že je v něm jakási vznešená hloubka."
    original: "Παρμενίδης δέ μοι φαίνεται, τὸ τοῦ Ὁμήρου, αἰδοῖός τέ μοι εἶναι ἅμα δεινός τε. συμπροσέμειξα γὰρ δὴ τῷ ἀνδρὶ πάνυ νέος πάνυ πρεσβύτῃ, καί μοι ἐφάνη βάθος τι ἔχειν παντάπασι γενναῖον"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés"
    zdroj: platon-theaitetos-tabory
  - id: theaitetos-181a
    osoba: platon
    autor: Platón
    dilo: Theaitétos
    misto: 180e–181a
    cesky: "Postupovali jsme kousek po kousku a ani jsme si nevšimli, že jsme se ocitli mezi oběma tábory. Jestli se nějak neubráníme a neutečeme, dopadneme jako ti, kdo si v palaistrách hrají na čáře: chytí je obě strany a táhnou každá na opačnou stranu."
    original: "κατὰ σμικρὸν γὰρ προϊόντες λελήθαμεν ἀμφοτέρων εἰς τὸ μέσον πεπτωκότες, καὶ ἂν μή πῃ ἀμυνόμενοι διαφύγωμεν, δίκην δώσομεν ὥσπερ οἱ ἐν ταῖς παλαίστραις διὰ γραμμῆς παίζοντες, ὅταν ὑπʼ ἀμφοτέρων ληφθέντες ἕλκωνται εἰς τἀναντία"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés; oba tábory jsou „tekoucí“ (Hérakleitovi stoupenci) a ti, kdo podle Parmenida a Melissa říkají, že všechno je jedno a stojí"
    zdroj: platon-theaitetos-tabory
  - id: plutarchos-theseus-23
    osoba: plutarchos
    autor: Plútarchos
    dilo: Théseus
    misto: 23, 1
    cesky: "Loď o třiceti veslech, na které Théseus vyplul s mladými lidmi a šťastně se vrátil, uchovávali Athéňané až do časů Démétria z Faléra. Stará prkna odstraňovali a vsazovali místo nich jiná, pevná. Filozofům se tak ta loď stala sporným příkladem v úvaze o růstu: jedni říkali, že zůstává táž, druzí, že táž nezůstává."
    original: "τὸ δὲ πλοῖον ἐν ᾧ μετὰ τῶν ἠϊθέων ἔπλευσε καὶ πάλιν ἐσώθη, τὴν τριακόντορον, ἄχρι τῶν Δημητρίου τοῦ Φαληρέως χρόνων διεφύλαττον οἱ Ἀθηναῖοι, τὰ μὲν παλαιὰ τῶν ξύλων ὑφαιροῦντες, ἄλλα δὲ ἐμβάλλοντες ἰσχυρὰ καὶ συμπηγνύντες οὕτως ὥστε καὶ τοῖς φιλοσόφοις εἰς τὸν αὐξόμενον λόγον ἀμφιδοξούμενον παράδειγμα τὸ πλοῖον εἶναι, τῶν μὲν ὡς τὸ αὐτό, τῶν δὲ ὡς οὐ τὸ αὐτὸ διαμένοι λεγόντων"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Perrina; αὐξόμενος λόγος = „rostoucí argument“, tady „úvaha o růstu“"
    zdroj: plutarchos-theseus
  - id: faidon-58a
    osoba: platon
    autor: Platón
    dilo: Faidón
    misto: 58a–b
    cesky: "To je ta loď, jak říkají Athéňané, na které kdysi Théseus odplul na Krétu s oněmi dvakrát sedmi a zachránil je i sebe."
    original: "τοῦτ’ ἔστι τὸ πλοῖον, ὥς φασιν Ἀθηναῖοι, ἐν ᾧ Θησεύς ποτε εἰς Κρήτην τοὺς δὶς ἑπτὰ ἐκείνους ᾤχετο ἄγων καὶ ἔσωσέ τε καὶ αὐτὸς ἐσώθη"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Faidón o lodi, kterou Athéňané každý rok posílali na Délos"
    zdroj: platon-faidon-58
  - id: de-sera-559-obec
    osoba: plutarchos
    autor: Plútarchos
    dilo: O pozdní odplatě bohů
    misto: 559a
    cesky: "Obec je jedna souvislá věc, jako živý tvor: změnami věku nepřestává být sama sebou. … Za všechno, co společně dělá nebo udělala, nese vinu i zásluhu."
    original: "ἓν γάρ τι πρᾶγμα καὶ συνεχὲς ἡ πόλις ὥσπερ ζῷον οὐκ ἐξιστάμενον αὑτοῦ ταῖς καθʼ ἡλικίαν μεταβολαῖς … καὶ πᾶσαν ὧν πράττει κατὰ τὸ κοινὸν ἢ ἔπραξεν αἰτίαν καὶ χάριν ἀναδεχόμενον"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); zkráceno; tím Plútarchos hájí, že obec smí nést následky toho, co udělala před generacemi"
    zdroj: plutarchos-de-sera
  - id: de-sera-559-dluznik
    osoba: plutarchos
    autor: Plútarchos
    dilo: O pozdní odplatě bohů
    misto: 559b
    cesky: "Kdo si kdysi půjčil, teď nic nedluží, protože se stal jiným. A kdo byl včera pozván na večeři, přichází dnes nepozván: je to přece někdo jiný."
    original: "ὁ γὰρ λαβὼν πάλαι τὸ χρέος νῦν οὐκ ὀφείλει γεγονὼς ἕτερος· ὁ δὲ κληθεὶς ἐπὶ δεῖπνον ἐχθὲς ἄκλητος ἥκει τήμερον· ἄλλος γάρ ἐστι"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); Plútarchos tak shrnuje „Epicharmovy věci“ a rostoucí argument, se kterým nesouhlasí"
    zdroj: plutarchos-de-sera
  - id: de-sera-559-zmeny
    osoba: plutarchos
    autor: Plútarchos
    dilo: O pozdní odplatě bohů
    misto: 559b–c
    cesky: "Věk přitom dělá s každým z nás větší změny než s celými obcemi. … Člověka by po čase stěží poznal podle podoby příbuzný nebo přítel."
    original: "καίτοι μείζονάς γε παραλλαγὰς αἱ ἡλικίαι περὶ ἕκαστον ἡμῶν ποιοῦσιν ἢ κοινῇ περὶ τὰς πόλεις … ἀνθρώπου δὲ μόλις ἄν τις οἰκεῖος ἢ φίλος ἐντυχὼν διὰ χρόνου μορφὴν γνωρίσειεν"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); zkráceno; námitku proti sobě vyslovuje Plútarchos sám"
    zdroj: plutarchos-de-sera
  - id: de-sera-559-jeden
    osoba: plutarchos
    autor: Plútarchos
    dilo: O pozdní odplatě bohů
    misto: 559c
    cesky: "A přece se o člověku říká, že je od narození až do konce jeden."
    original: "ἀλλʼ ἄνθρωπός τε λέγεται μέχρι τέλους εἷς ἀπὸ γενέσεως"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis)"
    zdroj: plutarchos-de-sera
  - id: de-sera-559-reka
    osoba: plutarchos
    autor: Plútarchos
    dilo: O pozdní odplatě bohů
    misto: 559c
    cesky: "Jinak, aniž si toho všimneme, naházíme všechno do Hérakleitovy řeky, do které se prý dvakrát vstoupit nedá, protože příroda vším hýbe a všechno proměňuje."
    original: "ἢ λήσομεν εἰς τὸν Ἡρακλείτειον ἅπαντα πράγματα ποταμὸν ἐμβαλόντες, εἰς ὃν οὔ φησι δὶς ἐμβῆναι τῷ πάντα κινεῖν καὶ ἑτεροιοῦν τὴν φύσιν μεταβάλλουσαν"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis)"
    zdroj: plutarchos-de-sera
  - id: de-e-392d-mnozi
    osoba: plutarchos
    autor: Plútarchos
    dilo: O delfském E
    misto: 392d
    cesky: "Nikdo nezůstává a nikdo není jeden; stáváme se mnohými."
    original: "μένει δʼ οὐδεὶς οὐδʼ ἔστιν εἷς, ἀλλὰ γιγνόμεθα πολλοί"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); mluví Ammónios, Plútarchův učitel"
    zdroj: plutarchos-de-e
  - id: de-e-392d-otazka
    osoba: plutarchos
    autor: Plútarchos
    dilo: O delfském E
    misto: 392d–e
    cesky: "Jak to, že když zůstáváme titíž, těší nás teď jiné věci než dřív, opačné věci máme rádi i nenávidíme, obdivujeme i haníme?"
    original: "ἐπεὶ πῶς οἱ αὐτοὶ μένοντες ἑτέροις χαίρομεν νῦν, ἑτέροις πρότερον, τἀναντία φιλοῦμεν ἢ μισοῦμεν καὶ θαυμάζομεν καὶ ψέγομεν;"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); mluví Ammónios"
    zdroj: plutarchos-de-e
  - id: de-e-392a-jsi
    osoba: plutarchos
    autor: Plútarchos
    dilo: O delfském E
    misto: 392a
    cesky: "Bůh každého z nás, kdo sem přichází, zdraví slovy Poznej sám sebe. … A my mu na oplátku říkáme: Jsi."
    original: "ὁ μὲν γὰρ θεὸς ἕκαστον ἡμῶν ἐνταῦθα προσιόντα οἷον ἀσπαζόμενος προσαγορεύει τὸ γνῶθι σαυτόν … ἡμεῖς δὲ πάλιν ἀμειβόμενοι τὸν θεὸν εἶ φαμέν"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); zkráceno; mluví Ammónios o nápisech v delfském chrámu"
    zdroj: plutarchos-de-e
  - id: comm-not-1083-dvoji
    osoba: plutarchos
    autor: Plútarchos
    dilo: O obecných pojmech proti stoikům
    misto: 1083d–e
    cesky: "Jedno v nás prý stále teče a je unášeno, druhé trvá, roste a ubývá. … Jenže nikdo z nás si nevšiml, že je dvojí: že jednou částí stále teče a druhou zůstává od narození až do konce týž."
    original: "τὸ μὲν ἀεὶ ῥεῖ καὶ φέρεται … τὸ δὲ διαμένει καὶ αὐξάνεται καὶ μειοῦται … οὐδʼ ἡμεῖς ᾐσθόμεθα διττοὶ γεγονότες καὶ τῷ μὲν ἀεὶ ῥέοντες μέρει τῷ δʼ ἀπὸ γενέσεως ἄχρι τελευτῆς οἱ αὐτοὶ διαμένοντες"
    preklad:
      druh: vlastni
      podle: "řecký text (Bernardakis); zkráceno; mluví akademik Diadúmenos proti stoikům, jejichž odpověď tu sám podává"
    zdroj: plutarchos-comm-not
  - id: seneca-ep-58-22
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 58, 22
    cesky: "Nikdo z nás není ve stáří týž, kým byl v mládí. Nikdo z nás není ráno týž, kým byl den předtím. Naše těla se ženou jako řeky. … Já sám, zatímco říkám, že se to mění, jsem se změnil."
    original: "Nemo nostrum idem est in senectute, qui fuit iuvenis; nemo nostrum est idem mane, qui fuit pridie. Corpora nostra rapiuntur fluminum more. … Ego ipse, dum loquor mutari ista, mutatus sum."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); zkráceno; Seneca tu vykládá, proč Platón nepočítá věci vnímané smysly mezi to, co skutečně je"
    zdroj: seneca-ep-58
  - id: seneca-ep-58-23
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 58, 23
    cesky: "To je to, co říká Hérakleitos: Do téže řeky dvakrát vstupujeme i nevstupujeme. Jméno řeky totiž zůstává stejné, voda protekla. U řeky je to zřejmější než u člověka."
    original: "Hoc est, quod ait Heraclitus: In idem flumen bis descendimus et non descendimus. Manet enim idem fluminis nomen, aqua transmissa est. Hoc in amne manifestius est quam in homine."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); pokračování (o lásce k tělu a strachu ze smrti) je citát seneca-ep-58-23-smrt"
    zdroj: seneca-ep-58
  - id: seneca-ep-58-23-smrt
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 58, 23
    cesky: "Ale i nás unáší proud stejně rychlý. Proto žasnu nad naší pošetilostí: tolik milujeme věc ze všech nejprchavější, tělo, a bojíme se, že jednou zemřeme, ačkoli každý okamžik je smrtí toho, čím jsme byli předtím. Přestaň se bát, že se jednou stane, co se děje každý den."
    original: "Sed nos quoque non minus velox cursus praetervehit, et ideo admiror dementiam nostram, quod tantopere amamus rem fugacissimam, corpus, timemusque, ne quando moriamur, cum omne momentum mors prioris habitus sit. Vis tu non timere, ne semel fiat, quod cotidie fit!"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); navazuje na větu o řece; prior habitus = předchozí stav. Závěr, ke kterému Seneca řeku potřebuje; argumenty o strachu ze smrti má cesta 8"
    zdroj: seneca-ep-58
  - id: symposion-207d
    osoba: platon
    autor: Platón
    dilo: Symposion
    misto: 207d
    cesky: "O člověku se říká, že je od dětství až do stáří tentýž. Nikdy v sobě nemá totéž, a přece se mu říká tentýž: stále se obnovuje a něco ztrácí, na vlasech, na mase, na kostech, na krvi, na celém těle."
    original: "οἷον ἐκ παιδαρίου ὁ αὐτὸς λέγεται ἕως ἂν πρεσβύτης γένηται· οὗτος μέντοι οὐδέποτε τὰ αὐτὰ ἔχων ἐν αὑτῷ ὅμως ὁ αὐτὸς καλεῖται, ἀλλὰ νέος ἀεὶ γιγνόμενος, τὰ δὲ ἀπολλύς, καὶ κατὰ τὰς τρίχας καὶ σάρκα καὶ ὀστᾶ καὶ αἷμα καὶ σύμπαν τὸ σῶμα"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; Sókratés vypráví, co mu řekla Diotima"
    zdroj: platon-symposion-207
  - id: symposion-207e
    osoba: platon
    autor: Platón
    dilo: Symposion
    misto: 207e
    cesky: "A nejen na těle. Ani v duši nezůstávají nikomu tytéž způsoby, povaha, názory, touhy, radosti, bolesti a strachy: jedno vzniká, druhé zaniká."
    original: "καὶ μὴ ὅτι κατὰ τὸ σῶμα, ἀλλὰ καὶ κατὰ τὴν ψυχὴν οἱ τρόποι, τὰ ἤθη, δόξαι, ἐπιθυμίαι, ἡδοναί, λῦπαι, φόβοι, τούτων ἕκαστα οὐδέποτε τὰ αὐτὰ πάρεστιν ἑκάστῳ, ἀλλὰ τὰ μὲν γίγνεται, τὰ δὲ ἀπόλλυται"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; slova Diotimy"
    zdroj: platon-symposion-207
  - id: symposion-208a
    osoba: platon
    autor: Platón
    dilo: Symposion
    misto: 208a
    cesky: "Zapomínání je odchod vědění. Opakování vkládá na místo toho, co odchází, novou vzpomínku a vědění tak zachraňuje, takže se zdá, že je pořád totéž."
    original: "λήθη γὰρ ἐπιστήμης ἔξοδος, μελέτη δὲ πάλιν καινὴν ἐμποιοῦσα ἀντὶ τῆς ἀπιούσης μνήμην σῴζει τὴν ἐπιστήμην, ὥστε τὴν αὐτὴν δοκεῖν εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; slova Diotimy; μελέτη = cvičení, opakování"
    zdroj: platon-symposion-207
  - id: symposion-208b
    osoba: platon
    autor: Platón
    dilo: Symposion
    misto: 208a–b
    cesky: "Tak se zachovává všechno smrtelné: ne tím, že je navždy úplně totéž jako božské, ale tím, že to, co odchází a stárne, po sobě nechává něco nového, takového, jaké bylo samo."
    original: "τούτῳ γὰρ τῷ τρόπῳ πᾶν τὸ θνητὸν σῴζεται, οὐ τῷ παντάπασιν τὸ αὐτὸ ἀεὶ εἶναι ὥσπερ τὸ θεῖον, ἀλλὰ τῷ τὸ ἀπιὸν καὶ παλαιούμενον ἕτερον νέον ἐγκαταλείπειν οἷον αὐτὸ ἦν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; slova Diotimy"
    zdroj: platon-symposion-207
  - id: kategorie-4a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Kategorie
    misto: 5, 4a17–21
    cesky: "Určitý člověk, jeden a tentýž, je jednou bledý a jindy opálený, jednou je mu teplo a jindy zima, jednou je špatný a jindy dobrý."
    original: "ὁ τὶς ἄνθρωπος, εἷς καὶ ὁ αὐτὸς ὤν, ὁτὲ μὲν λευκὸς ὁτὲ δὲ μέλας γίνεται, καὶ θερμὸς καὶ ψυχρός, καὶ φαῦλος καὶ σπουδαῖος"
    preklad:
      druh: vlastni
      podle: "řecký text (Bekker 1837, First1KGreek), bez srovnání s překladem; řádky podle běžného číslování, ve vydání nejsou; λευκός a μέλας = doslova bílý a černý, tady o pleti (bledý a osmahlý); θερμός a ψυχρός = doslova teplý a studený"
    zdroj: aristoteles-kategorie-4a
  - id: fyzika-i-7
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: I, 7
    cesky: "Člověk totiž zůstává, když se stává vzdělaným, a je to člověk. Nevzdělanost nezůstává."
    original: "ὁ μὲν γὰρ ἄνθρωπος ὑπομένει μουσικὸς γιγνόμενος ἄνθρωπος καὶ ἔστι, τὸ δὲ μὴ μουσικὸν καὶ τὸ ἄμουσον οὔτε ἁπλῶς οὔτε συντεθειμένον ὑπομένει"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s překladem; běžně se cituje jako 190a9–13, ve vydání číslování není; μουσικός = vzdělaný v múzických uměních; konec věty zkrácen"
    zdroj: aristoteles-fyzika-i
  - id: politika-1276a-reky
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: III, 3, 1276a36–39
    cesky: "I o řekách a pramenech jsme zvyklí říkat, že jsou tytéž, ačkoli voda stále přitéká a odtéká."
    original: "ὥσπερ καὶ ποταμοὺς εἰώθαμεν λέγειν τοὺς αὐτοὺς καὶ κρήνας τὰς αὐτάς, καίπερ αἰεὶ τοῦ μὲν ἐπιγινομένου νάματος τοῦ δʼ ὑπεξιόντος"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; Aristotelés se ptá, kdy je obec táž"
    zdroj: aristoteles-politika-iii
  - id: politika-1276b-sbor
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: III, 3, 1276b4–6
    cesky: "O sboru říkáme, že je jiný, když hraje komedii, a jiný, když hraje tragédii, i když v něm často jsou titíž lidé."
    original: "ὥσπερ γε καὶ χορὸν ὁτὲ μὲν κωμικὸν ὁτὲ δὲ τραγικὸν ἕτερον εἶναί φαμεν, τῶν αὐτῶν πολλάκις ἀνθρώπων ὄντων"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama"
    zdroj: aristoteles-politika-iii
  - id: etika-1166a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: IX, 4, 1166a19–23
    cesky: "Každý si přeje dobré věci pro sebe. Nikdo si nezvolí mít všechno za tu cenu, že se stane někým jiným; chce zůstat tím, čím je. A každý je, zdá se, tím, co v něm myslí, nebo aspoň tím nejvíc."
    original: "ἕκαστος δʼ ἑαυτῷ βούλεται τἀγαθά, γενόμενος δʼ ἄλλος αἱρεῖται οὐδεὶς πάντʼ ἔχειν ἐκεῖνο τὸ γενόμενον … ἀλλʼ ὢν ὅ τι ποτʼ ἐστίν· δόξειε δʼ ἂν τὸ νοοῦν ἕκαστος εἶναι ἢ μάλιστα"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater), bez srovnání s překladem; vynechána vsuvka o bohu, který dobro má už teď"
    zdroj: aristoteles-etika-ix
  - id: faidros-229e
    osoba: sokrates
    autor: Platón
    dilo: Faidros
    misto: 229e–230a
    cesky: "Ještě nedokážu, jak žádá delfský nápis, poznat sám sebe. … Nezkoumám tedy tyhle věci, ale sebe: jestli jsem obluda spletitější a nadutější než Týfón, nebo tvor krotší a prostší."
    original: "οὐ δύναμαί πω κατὰ τὸ Δελφικὸν γράμμα γνῶναι ἐμαυτόν … σκοπῶ οὐ ταῦτα ἀλλʼ ἐμαυτόν, εἴτε τι θηρίον ὂν τυγχάνω Τυφῶνος πολυπλοκώτερον καὶ μᾶλλον ἐπιτεθυμμένον, εἴτε ἡμερώτερόν τε καὶ ἁπλούστερον ζῷον"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; zkráceno; Platón nechává mluvit Sókrata; Týfón je stohlavá obluda z bájí"
    zdroj: platon-faidros
  - id: faidon-115c
    osoba: platon
    autor: Platón
    dilo: Faidón
    misto: 115c
    cesky: "Nedaří se mi, přátelé, přesvědčit Kritóna, že já jsem tenhle Sókratés, který s vámi teď rozmlouvá a pořádá každé slovo."
    original: "οὐ πείθω, ὦ ἄνδρες, Κρίτωνα, ὡς ἐγώ εἰμι οὗτος Σωκράτης, ὁ νυνὶ διαλεγόμενος καὶ διατάττων ἕκαστον τῶν λεγομένων"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés v posledním dni; věta pokračuje tím, že Kritón za něj má tělo, které za chvíli uvidí mrtvé (atlas necituje)"
    zdroj: platon-faidon-58
  - id: hovory-xii-3
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: XII, 3
    cesky: "Skládáš se ze tří věcí: z těla, z dechu a z rozumu. První dvě jsou tvoje jen potud, že se o ně máš starat. Jen ta třetí je doopravdy tvoje."
    original: "Τρία ἐστὶν ἐξ ὧν συνέστηκας· σωμάτιον, πνευμάτιον, νοῦς. τούτων τἄλλα μέχρι τοῦ ἐπιμελεῖσθαι δεῖν σά ἐστι, τὸ δὲ τρίτον μόνον κυρίως σόν."
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold), bez srovnání s překladem"
    zdroj: marcus-hovory-promena
  - id: hovory-x-7
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: X, 7
    cesky: "Nepředstavuj si, že to pevné a to vzdušné v tobě je ještě to z narození. Všechno to přiteklo včera a předevčírem z jídla a ze vzduchu, který vdechuješ. Mění se tedy to, co tělo přijalo, ne to, co porodila matka."
    original: "καὶ τὸ στερέμνιον δὲ καὶ τὸ πνευματικὸν μὴ φαντάζου τὸ ἀπὸ τῆς πρώτης γενέσεως· πᾶν γὰρ τοῦτο ἐχθὲς καὶ τρίτην ἡμέραν ἐκ τῶν σιτίων καὶ τοῦ ἑλκομένου ἀέρος τὴν ἐπιρροὴν ἔλαβεν· τοῦτο οὖν ὃ ἔλαβε μεταβάλλει, οὐχ ὃ ἡ μήτηρ ἔτεκεν."
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold), bez srovnání s překladem; „tělo“ doplněno; věta, která následuje, je nejasná a atlas ji necituje"
    zdroj: marcus-hovory-promena
  - id: rozpravy-ii-10-1
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: II, 10, 1–3
    cesky: "Uvaž, kdo jsi. Především člověk, tedy někdo, kdo nemá nic svrchovanějšího než svou vůli. … K tomu jsi občan světa a jeho část."
    original: "σκέψαι τίς εἶ. τὸ πρῶτον ἄνθρωπος, τοῦτο δʼ ἔστιν οὐδὲν ἔχων κυριώτερον προαιρέσεως … ἐπὶ τούτοις πολίτης εἶ τοῦ κόσμου καὶ μέρος αὐτοῦ"
    preklad:
      druh: vlastni
      podle: "řecký text (Schenkl), bez srovnání s překladem; zkráceno; προαίρεσις = vůle, volba; k dalšímu obsahu kapitoly viz podklady, Citlivá místa"
    zdroj: epiktetos-rozpravy-ii-10
  - id: lucretius-iii-847
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 847–851
    cesky: "A kdyby čas po naší smrti sebral naši látku a složil ji zase tak, jak je teď, a znovu nám bylo dáno světlo života, ani to by se nás vůbec netýkalo, jakmile se jednou přetrhla vzpomínka na nás samé."
    original: "nec, si materiem nostram collegerit aetas post obitum rursumque redegerit ut sita nunc est, atque iterum nobis fuerint data lumina vitae, pertineat quicquam tamen ad nos id quoque factum, interrupta semel cum sit repetentia nostri"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); próza místo veršů"
    zdroj: lucretius-iii-830
  - id: seneca-ira-ii-10
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: II, 10, 5
    cesky: "Kdykoli Hérakleitos vyšel ven a viděl kolem sebe tolik lidí, kteří špatně žijí, plakal. … O Démokritovi zase vyprávějí, že se na veřejnosti nikdy neobjevil bez smíchu."
    original: "Heraclitus quotiens prodierat et tantum circa se male viventium, immo male pereuntium viderat, flebat … Democritum contra aiunt numquam sine risu in publico fuisse"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); zkráceno; doklad pozdní představy o „plačícím filozofovi“"
    zdroj: seneca-plac
  - id: herodotos-64
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Hérodotovi
    misto: Diogenés Laertios X, 64
    cesky: "Duše by vnímat nemohla, kdyby ji nějak nekrylo ostatní tělo. A tělo, které jí to umožnilo, má od ní na vnímání podíl i samo."
    original: "οὐ μὴν εἰλήφει ἂν ταύτην, εἰ μὴ ὑπὸ τοῦ λοιποῦ ἀθροίσματος ἐστεγάζετό πως. τὸ δὲ λοιπὸν ἄθροισμα παρασκευάσαν ἐκείνῃ τὴν αἰτίαν ταύτην μετείληφε καὶ αὐτὸ τοιούτου συμπτώματος παρʼ ἐκείνης"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; volněji: ταύτην odkazuje k „příčině vnímání“ z předchozí věty; τὸ λοιπὸν ἄθροισμα = „zbytek celku“, tedy tělo bez duše"
    zdroj: dl-x-63
  # Celek 8 „Čí život vlastně žiju?“ (P6, 15. 10. 2026). Vlastní převody z řeckého textu uvedeného u pramene; publikované
  # české překlady (A. Kolář, A. Kříž, F. Novotný) jsem neměl v ruce. τῦφος převádím v Kratétových verších jako „dým“
  # (doslova kouř, mlha; přeneseně nadutost, klam) a v Platónově odpovědi Diogenovi jako „nadutost“; obojí je totéž slovo.
  # Diogenés Laertios psal asi 500 let po Kratétovi a Hipparchii: jeho průpovídky jsou tradované.
  - id: dl-vi-85-pera
    osoba: krates
    autor: Kratés
    dilo: Hravé verše
    misto: u Diogena Laertia VI, 85
    cesky: "Je jedno město, Péra, uprostřed vínově tmavého dýmu, krásné a úrodné, celé špinavé, nemá nic. Nepřipluje do něj žádný hloupý příživník … Rodí tymián, česnek, fíky a chleba. Kvůli tomu se lidé mezi sebou neperou a nechápou se zbraní pro drobné ani pro slávu."
    original: "Πήρη τις πόλις ἐστὶ μέσῳ ἐνὶ οἴνοπι τύφῳ, καλὴ καὶ πίειρα, περίρρυπος, οὐδὲν ἔχουσα, εἰς ἣν οὔτε τις εἰσπλεῖ ἀνὴρ μωρὸς παράσιτος … ἀλλὰ θύμον καὶ σκόρδα φέρει καὶ σῦκα καὶ ἄρτους, ἐξ ὧν οὐ πολεμοῦσι πρὸς ἀλλήλους περὶ τούτων, οὐχ ὅπλα κέκτηνται περὶ κέρματος, οὐ περὶ δόξης."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; πήρα = mošna žebráka a kynika; parodie Odyssey XIX, 172–173 (Kréta uprostřed vínově tmavého moře); zkráceno o verš o mlsounovi, který se chlubí nevěstkou"
    zdroj: dl-vi-85
  - id: dl-vi-86-cenik
    osoba: krates
    autor: Kratés
    dilo: Deník
    misto: u Diogena Laertia VI, 86
    cesky: "Kuchaři počítej deset min, lékaři drachmu, lichotníkovi pět talentů, rádci dým, … filozofovi tři oboly."
    original: "τίθει μαγείρῳ μνᾶς δέκʼ, ἰατρῷ δραχμήν, κόλακι τάλαντα πέντε, συμβούλῳ καπνόν, … φιλοσόφῳ τριώβολον."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; rádci καπνός (kouř); vynechána položka „nevěstce talent“; talent je šest tisíc drachem, obol šestina drachmy"
    zdroj: dl-vi-85
  - id: dl-vi-86-co-mam
    osoba: krates
    autor: Kratés
    dilo: Hravé verše
    misto: u Diogena Laertia VI, 86
    cesky: "Mám to, co jsem se naučil a promyslel a co vznešeného jsem poznal s Múzami. To ostatní, mnoho a bohatého, sebral dým."
    original: "ταῦτʼ ἔχω ὅσσʼ ἔμαθον καὶ ἐφρόντισα καὶ μετὰ Μουσῶν σέμνʼ ἐδάην· τὰ δὲ πολλὰ καὶ ὄλβια τῦφος ἔμαρψεν."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; parodie verše o Sardanapallovi („mám, co jsem snědl…“, Strabón XIV, 5, 9)"
    zdroj: dl-vi-85
  - id: dl-vi-92-oslari
    osoba: krates
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 92
    cesky: "Filozofovat se má tak dlouho, dokud se vojevůdci nezačnou zdát oslaři."
    original: "μέχρι τούτου δεῖν φιλοσοφεῖν, μέχρι ἂν δόξωσιν οἱ στρατηγοὶ εἶναι ὀνηλάται"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; v originále nepřímá řeč („říkal, že…“)"
    zdroj: dl-vi-85
  - id: dl-vi-93-vlast
    osoba: krates
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 93
    cesky: "Mou vlastí je neslavnost a chudoba, ty osud nedobude. A jsem spoluobčanem Diogena, proti kterému závist nic nezmůže."
    original: "ἔχειν δὲ πατρίδα ἀδοξίαν καὶ πενίαν ἀνάλωτα τῇ τύχῃ καὶ Διογένους εἶναι πολίτης ἀνεπιβουλεύτου φθόνῳ"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; v originále nepřímá řeč; ἀδοξία = být bez slávy, bez pověsti; stojí hned za odpovědí Alexandrovi, který mu nabízel obnovit Théby"
    zdroj: dl-vi-85
  - id: dl-vi-96-zenich
    osoba: krates
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 96
    cesky: "Tady je ženich a tohle je jeho majetek. Podle toho se rozhodni. Mou družkou nebudeš, jestli se nebudeš věnovat témuž co já."
    original: "ὁ μὲν νυμφίος οὗτος, ἡ δὲ κτῆσις αὕτη, πρὸς ταῦτα βουλεύου· οὐδὲ γὰρ ἔσεσθαι κοινωνόν, εἰ μὴ καὶ τῶν αὐτῶν ἐπιτηδευμάτων γενηθείη."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; Kratés to říká Hipparchii, když před ní vstal a odložil svou výbavu (σκευή); druhá věta je v originále nepřímá řeč; κοινωνός = společník, druh"
    zdroj: dl-vi-85
  - id: dl-vii-3-zenon
    osoba: krates
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VII, 3
    cesky: "Proč utíkáš, Féničánku? Nic hrozného se ti nestalo."
    original: "τί φεύγεις, Φοινικίδιον; οὐδὲν δεινὸν πέπονθας."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; Kratés Zénónovi, když mu holí rozbil hrnec s čočkovou polévkou, který se Zénón styděl nést přes Kerameikos"
    zdroj: dl-vii-2
  - id: dl-vi-97-sofisma
    osoba: hipparchia
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 97
    cesky: "Co kdyby udělal Theodóros, a nikdo by neřekl, že jedná nespravedlivě, to když udělá Hipparchia, taky nikdo neřekne, že jedná nespravedlivě. Theodóros nejedná nespravedlivě, když bije sám sebe. Tedy ani Hipparchia nejedná nespravedlivě, když bije Theodóra."
    original: "ὃ ποιῶν Θεόδωρος οὐκ ἂν ἀδικεῖν λέγοιτο, οὐδʼ Ἱππαρχία ποιοῦσα τοῦτο ἀδικεῖν λέγοιτʼ ἄν· Θεόδωρος δὲ τύπτων ἑαυτὸν οὐκ ἀδικεῖ, οὐδʼ ἄρα Ἱππαρχία Θεόδωρον τύπτουσα ἀδικεῖ."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; Diogenés Laertios to nazývá sofismatem (σόφισμα); hostina u Lýsimacha"
    zdroj: dl-vi-85
  - id: dl-vi-98
    osoba: hipparchia
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 98
    cesky: "Jsem to já, Theodóre. Snad si nemyslíš, že jsem o sobě rozhodla špatně, když jsem čas, který jsem měla strávit u stavu, dala vzdělání?"
    original: "ἐγώ, φησίν, εἰμί, Θεόδωρε· ἀλλὰ μὴ κακῶς σοι δοκῶ βεβουλεῦσθαι περὶ αὑτῆς, εἰ, τὸν χρόνον ὃν ἔμελλον ἱστοῖς προσαναλώσειν, τοῦτον εἰς παιδείαν κατεχρησάμην;"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; odpověď na Theodórův verš z Eurípidových Bakchantek (1236) o ženě, která opustila člunky u stavů; παιδεία = vzdělání, výchova"
    zdroj: dl-vi-85
  - id: dl-vi-26-diogenes
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 26
    cesky: "Šlapu po Platónově marnivosti."
    original: "πατῶ τὴν Πλάτωνος κενοσπουδίαν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; Diogenés šlape po kobercích v Platónově domě, kam Platón pozval přátele od Dionýsia; podle jiných řekl „po Platónově nadutosti“ (τῦφον)"
    zdroj: dl-vi-20
  - id: dl-vi-26-platon
    osoba: platon
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 26
    cesky: "Kolik nadutosti, Diogene, ukazuješ tím, že se zdáš bez nadutosti!"
    original: "ὅσον, ὦ Διόγενες, τοῦ τύφου διαφαίνεις, δοκῶν μὴ τετυφῶσθαι."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; první verze Platónovy odpovědi; διαφαίνεις = necháváš prosvítat"
    zdroj: dl-vi-20
  - id: dl-vi-26-jinou
    osoba: platon
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 26
    cesky: "Ano, Diogene, jinou nadutostí."
    original: "ἑτέρῳ γε τύφῳ, Διόγενες"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; druhá verze („jiní říkají“), odpověď na Diogenovo „šlapu po Platónově nadutosti“"
    zdroj: dl-vi-20
  - id: dl-vi-8-plast
    osoba: sokrates
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 8
    cesky: "Skrz tvůj plášť vidím, jak toužíš po slávě."
    original: "ὁρῶ σου διὰ τοῦ τρίβωνος τὴν φιλοδοξίαν."
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; Sókratés Antisthenovi, který natočil roztrženou část pláště tak, aby byla vidět; totéž II, 36"
    zdroj: dl-vi-8
  - id: dl-vi-8-chvala
    osoba: antisthenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 8
    cesky: "„Mnoho lidí tě chválí.“ – „A co jsem provedl špatného?“"
    original: "πρὸς τὸν εἰπόντα, πολλοί σε ἐπαινοῦσι, τί γάρ, ἔφη, κακὸν πεποίηκα;"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-vi-8
  - id: etika-1103a-priroda
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 1, 1103a23–26
    cesky: "Ctnosti v nás tedy nevznikají přírodou, ani proti přírodě. Od přírody jsme schopni je přijmout, a dokonalými nás v nich dělá zvyk."
    original: "οὔτʼ ἄρα φύσει οὔτε παρὰ φύσιν ἐγγίνονται αἱ ἀρεταί, ἀλλὰ πεφυκόσι μὲν ἡμῖν δέξασθαι αὐτάς, τελειουμένοις δὲ διὰ τοῦ ἔθους."
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; ἔθος = zvyk, návyk"
    zdroj: aristoteles-etika-ii
  - id: etika-1120a-marnotratnik
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: IV, 1, 1120a1–3
    cesky: "Marnotratník je ten, kdo hyne vlastní vinou. Zdá se totiž, že i zničit majetek je kus zkázy sebe sama, protože z něj žijeme."
    original: "ἄσωτος γὰρ ὁ διʼ αὑτὸν ἀπολλύμενος, δοκεῖ δʼ ἀπώλειά τις αὑτοῦ εἶναι καὶ ἡ τῆς οὐσίας φθορά, ὡς τοῦ ζῆν διὰ τούτων ὄντος."
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; οὐσία = jmění; marnotratnost je podle Aristotela přemíra v dávání a nedostatek v braní"
    zdroj: aristoteles-etika-iv
  - id: etika-1120b-stedry
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: IV, 1, 1120b1–4
    cesky: "O své nebude nedbat, protože jím chce druhým pomáhat. A nebude dávat komukoli, aby mohl dát těm, komu má, kdy a kde je to správné."
    original: "οὐδʼ ἀμελήσει τῶν ἰδίων, βουλόμενός γε διὰ τούτων τισὶν ἐπαρκεῖν. οὐδὲ τοῖς τυχοῦσι δώσει, ἵνα ἔχῃ διδόναι οἷς δεῖ καὶ ὅτε καὶ οὗ καλόν."
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; o štědrém (ἐλευθέριος). Hned dál (1120b4–6): pro štědrého je typické dát tolik, že sobě nechá méně"
    zdroj: aristoteles-etika-iv
  - id: etika-1134b-ruka
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: V, 7, 1134b24–35
    cesky: "Některým se zdá, že všechno spravedlivé je jen podle zákona: co je od přírody, je neměnné a všude má stejnou moc, jako oheň pálí tady i v Persii, kdežto spravedlivé věci se podle nich mění. Tak to ale není, jen do jisté míry. … Pravá ruka je od přírody silnější, a přece se mohou všichni stát obouručními."
    original: "δοκεῖ δʼ ἐνίοις εἶναι πάντα τοιαῦτα, ὅτι τὸ μὲν φύσει ἀκίνητον καὶ πανταχοῦ τὴν αὐτὴν ἔχει δύναμιν, ὥσπερ τὸ πῦρ καὶ ἐνθάδε καὶ ἐν Πέρσαις καίει, τὰ δὲ δίκαια κινούμενα ὁρῶσιν. τοῦτο δʼ οὐκ ἔστιν οὕτως ἔχον, ἀλλʼ ἔστιν ὥς· … φύσει γὰρ ἡ δεξιὰ κρείττων, καίτοι ἐνδέχεται πάντας ἀμφιδεξίους γενέσθαι."
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; „takové“ = podle zákona, ne od přírody (1134b18–24); vynecháno: u bohů snad ne, u nás je něco i od přírody, i když se všechno může měnit (1134b28–30)"
    zdroj: aristoteles-etika-v
  - id: politika-1260a-ctnost
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 13, 1260a20–24
    cesky: "Uměřenost ženy a muže není táž, ani jejich statečnost a spravedlnost, jak si myslel Sókratés. Jedna statečnost je k vládnutí, druhá ke službě."
    original: "καὶ οὐχ ἡ αὐτὴ σωφροσύνη γυναικὸς καὶ ἀνδρός, οὐδʼ ἀνδρεία καὶ δικαιοσύνη, καθάπερ ᾤετο Σωκράτης, ἀλλʼ ἡ μὲν ἀρχικὴ ἀνδρεία ἡ δʼ ὑπηρετική"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; navazuje na 1260a12–14 (žena rozvahu má, ale bez rozhodující váhy)"
    zdroj: aristoteles-politika-i
  - id: ustava-455d-zeny
    osoba: platon
    autor: Platón
    dilo: Ústava
    misto: V, 455d–456a
    cesky: "Žádné zaměstnání ve správě obce tedy nepatří ženě proto, že je žena, ani muži proto, že je muž. Přirozené vlohy jsou rozesety u obou podobně a žena má od přírody podíl na všech zaměstnáních a muž také, jen je ve všem slabší žena než muž. … Jedna žena má sklon k filozofii, druhá moudrost nesnáší."
    original: "οὐδὲν ἄρα ἐστίν, ὦ φίλε, ἐπιτήδευμα τῶν πόλιν διοικούντων γυναικὸς διότι γυνή, οὐδʼ ἀνδρὸς διότι ἀνήρ, ἀλλʼ ὁμοίως διεσπαρμέναι αἱ φύσεις ἐν ἀμφοῖν τοῖν ζῴοιν, καὶ πάντων μὲν μετέχει γυνὴ ἐπιτηδευμάτων κατὰ φύσιν, πάντων δὲ ἀνήρ, ἐπὶ πᾶσι δὲ ἀσθενέστερον γυνὴ ἀνδρός. … φιλόσοφός τε καὶ μισόσοφος"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad P. Shoreyho; mluví Sókratés, Glaukón přisvědčuje; poslední věta v originále otázka („a jedna filozofická, druhá nenávidí moudrost?“)"
    zdroj: platon-ustava-perseus
  - id: rozpravy-iii-22-10
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 22, 10–11
    cesky: "„Plášť nosím už teď a budu ho mít i potom. Spím natvrdo už teď a budu i potom. Vezmu si k tomu mošnu a hůl, budu obcházet, žebrat od lidí a nadávat jim…“ Jestli si to představuješ takhle, drž se od toho daleko."
    original: "τριβώνιον καὶ νῦν φορῶ καὶ τόθʼ ἕξω, κοιμῶμαι καὶ νῦν σκληρῶς καὶ τότε κοιμήσομαι, πηρίδιον προσλήψομαι καὶ ξύλον καὶ περιερχόμενος αἰτεῖν ἄρξομαι τοὺς ἀπαντῶντας, λοιδορεῖν … εἰ τοιοῦτόν τι φαντάζῃ τὸ πρᾶγμα, μακρὰν ἀπʼ αὐτοῦ"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl); Epiktétos odpovídá žákovi, který se chce stát kynikem; zkráceno o to, koho bude kynik kárat (kdo si škube chloupky, česá kadeře, chodí v šarlatu)"
    zdroj: epiktetos-rozpravy-iii-22
  - id: rozpravy-iii-22-19
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 22, 19
    cesky: "Nejdřív musíš udělat čistým to, co v tobě vládne."
    original: "πρῶτον οὖν τὸ ἡγεμονικόν σε δεῖ τὸ σαυτοῦ καθαρὸν ποιῆσαι"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl); τὸ ἡγεμονικόν = to, co v člověku vládne, rozum"
    zdroj: epiktetos-rozpravy-iii-22
  - id: rozpravy-iii-22-50
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 22, 50
    cesky: "Tohle je kynický hlas, tohle kynická povaha a záměr. Ne mošnička, hůl a velká ústa: sníst všechno, co dostaneš, nebo si to schovat, nadávat lidem v nepravou chvíli a ukazovat pěkné rameno."
    original: "ἴδε κυνικαὶ φωναί, ἴδε χαρακτήρ, ἴδʼ ἐπιβολή. οὔ· ἀλλὰ πηρίδιον καὶ ξύλον καὶ γνάθοι μεγάλαι· καταφαγεῖν πᾶν ὃ εἂν δῷς ἢ ἀποθησαυρίσαι ἢ τοῖς ἀπαντῶσι λοιδορεῖσθαι ἀκαίρως ἢ καλὸν τὸν ὦμον δεικνύειν."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl); „tohle“ = slova kynika, kterého Epiktétos právě nechal mluvit (45–49: bez domu a obce, a co mi chybí?); druhá věta říká, co si pod kynismem představují jiní"
    zdroj: epiktetos-rozpravy-iii-22
  - id: rozpravy-iii-22-76
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 22, 76
    cesky: "‚Ale Kratés se oženil.‘ – ‚Mluvíš o zvláštním případu, který vznikl z lásky, a o ženě, která byla druhý Kratés.‘"
    original: "ναί· ἀλλὰ Κράτης ἔγημεν. — περίστασίν μοι λέγεις ἐξ ἔρωτος γενομένην καὶ γυναῖκα τιθεῖς ἄλλον Κράτητα."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl); doslova „a ženu kladeš jako jiného Kratéta“"
    zdroj: epiktetos-rozpravy-iii-22
  - id: rozpravy-i-2-11
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 2, 11
    cesky: "Ty jsi ten, kdo se zná: kolik máš sám pro sebe cenu a za kolik se prodáváš. Každý se prodává za jinou cenu."
    original: "σὺ γὰρ εἶ ὁ σαυτὸν εἰδώς, πόσου ἄξιος εἶ σεαυτῷ καὶ πόσου σεαυτὸν πιπράσκεις· ἄλλοι γὰρ ἄλλων πιπράσκουσιν."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; kapitola o tom, jak si člověk uchová, co mu sluší (τὸ κατὰ πρόσωπον)"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-i-2-32
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 2, 32
    cesky: "Býkem se nikdo nestane najednou, ani ušlechtilým člověkem. Musí se přes zimu cvičit, připravit se a nevrhat se bezhlavě na to, co mu nepřísluší."
    original: "ἄφνω δὲ ταῦρος οὐ γίνεται οὐδὲ γενναῖος ἄνθρωπος, ἀλλὰ δεῖ χειμασκῆσαι, παρασκευάσασθαι καὶ μὴ εἰκῇ προσπηδᾶν ἐπὶ τὰ μηδὲν προσήκοντα."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; odpověď na otázku, jak člověk pozná, co mu sluší (30–31: býk pozná svou sílu, když přijde lev)"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-i-2-33
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 2, 33
    cesky: "Jen uvaž, za kolik prodáváš svou vůli. Člověče, když už nic jiného, neprodávej ji levně."
    original: "μόνον σκέψαι, πόσου πωλεῖς τὴν σεαυτοῦ προαίρεσιν. ἄνθρωπε, εἰ μηδὲν ἄλλο, μὴ ὀλίγου αὐτὴν πωλήσῃς."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; προαίρεσις = vůle, jako v celku 3"
    zdroj: epiktetos-rozpravy
  # Celek 9 „Kam mi mizí čas?“: vlastní převody z docs/podklady/celek-9.md, tabulky b a c.
  - id: brevitate-1-3
    osoba: seneca
    autor: Seneca
    dilo: O krátkosti života
    misto: "1, 3"
    cesky: "Nemáme málo času, jen jsme ho hodně promarnili."
    original: "Non exiguum temporis habemus, sed multum perdidimus."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library)"
    zdroj: seneca-brevitate
  - id: brevitate-3-2
    osoba: seneca
    autor: Seneca
    dilo: O krátkosti života
    misto: "3, 2"
    cesky: "Spočítej si svůj věk. Odečti, kolik z toho času ti vzal věřitel, kolik mocný příznivec, kolik klient … kolik obíhání města kvůli povinnostem. Přidej nemoci, které jsme si způsobili sami, a co leželo ladem: uvidíš, že máš míň let, než napočítáš."
    original: "ad computationem aetatem tuam revoca. Duc quantum ex isto tempore creditor, […] quantum rex, quantum cliens abstulerit, […] quantum officiosa per urbem discursatio; adice morbos quos manu fecimus, adice quod et sine usu iacuit: videbis te pauciores annos habere quam numeras."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); zkráceno, vynechány milenka, hádky s manželkou a trestání otroků; rex = mocný příznivec"
    zdroj: seneca-brevitate
  - id: brevitate-20-4
    osoba: seneca
    autor: Seneca
    dilo: O krátkosti života
    misto: "20, 4"
    cesky: "Tak moc to těší, umřít zaneprázdněný?"
    original: "Adeone iuvat occupatum mori?"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); occupatus = zaneprázdněný"
    zdroj: seneca-brevitate
  - id: brevitate-20-1
    osoba: seneca
    autor: Seneca
    dilo: O krátkosti života
    misto: "20, 1"
    cesky: "Nejubožejší jsou ti, kdo … spí podle cizího spánku a chodí cizím krokem. Kdo z nich chce vědět, jak krátký je jeho život, ať si spočítá, jak velká část z něj je jeho."
    original: "eorum tamen miserrima, qui […] ad alienum dormiunt somnum, ad alienum ambulant gradum […] Hi si volent scire quam brevis ipsorum vita sit, cogitent ex quota parte sua sit."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library)"
    zdroj: seneca-brevitate
  - id: brevitate-18-1
    osoba: seneca
    autor: Seneca
    dilo: O krátkosti života
    misto: "18, 1"
    cesky: "Větší část života, a jistě ta lepší, patřila obci. Vezmi si trochu svého času i pro sebe."
    original: "Maior pars aetatis, certe melior rei publicae datast: aliquid temporis tui sume etiam tibi."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library)"
    zdroj: seneca-brevitate
  - id: hovory-iv-3-ustrani
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: "IV, 3"
    cesky: "Lidé hledají ústraní na venkově, u moře, v horách. I ty po tom obvykle nejvíc toužíš. … Můžeš se přece kdykoli, kdy chceš, uchýlit do sebe."
    original: "Ἀναχωρήσεις αὑτοῖς ζητοῦσιν ἀγροικίας καὶ αἰγιαλοὺς καὶ ὄρη, εἴωθας δὲ καὶ σὺ τὰ τοιαῦτα μάλιστα ποθεῖν […] ἐξόν, ἧς ἂν ὥρας ἐθελήσῃς, εἰς ἑαυτὸν ἀναχωρεῖν."
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); začátek kapitoly, závěr je citát hovory-iv-3"
    zdroj: marcus-hovory
  - id: hovory-viii-8
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: "VIII, 8"
    cesky: "Číst nemůžeš. Ale držet na uzdě pýchu můžeš. Být silnější než slast a bolest můžeš. Být nad slávičkou můžeš. Nezlobit se na necitelné a nevděčné, a dokonce se o ně starat, můžeš."
    original: "Ἀναγινώσκειν οὐκ ἔξεστιν. ἀλλὰ ὕβριν ἀνείργειν ἔξεστιν· ἀλλὰ ἡδονῶν καὶ πόνων καθυπερτερεῖν ἔξεστιν· ἀλλὰ τοῦ δοξαρίου ὑπεράνω εἶναι ἔξεστιν· ἀλλὰ ἀναισθήτοις καὶ ἀχαρίστοις μὴ θυμοῦσθαι, προσέτι κήδεσθαι αὐτῶν ἔξεστιν."
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); δοξάριον = zdrobnělina, slávička"
    zdroj: marcus-hovory
  - id: hovory-iv-24
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: "IV, 24"
    cesky: "‚Dělej málo, chceš-li mít klidnou mysl,‘ říká se. Není lepší dělat to nutné? … Většina toho, co říkáme a děláme, nutná není. Kdo to odstraní, bude mít víc volna a míň zmatku. Proto se u každé věci ptej: Nepatří tohle k tomu, co nutné není?"
    original: "Ὀλίγα πρῆσσε, φησίν, εἰ μέλλεις εὐθυμήσειν. μήποτε ἄμεινον τἀναγκαῖα πράσσειν […] τὰ πλεῖστα γὰρ ὧν λέγομεν καὶ πράσσομεν οὐκ ἀναγκαῖα ὄντα ἐάν τις περιέλῃ, εὐσχολώτερος καὶ ἀταρακτότερος ἔσται. ὅθεν δεῖ καὶ παρ’ ἕκαστα ἑαυτὸν ὑπομιμνῄσκειν· μήτι τοῦτο τῶν οὐκ ἀναγκαίων;"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); citovaná věta je Démokritův zlomek (DK 68 B3), Marcus ji uvozuje jen φησίν"
    zdroj: marcus-hovory
  # Celek 10 (cesta 33): vlastní převody podle podkladů docs/podklady/celek-10.md › Citáty.
  - id: rozpravy-iii-7-36
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 7, 36
    cesky: "Přijdeš o člověka spolehlivého a slušného. Větší škodu nehledej."
    original: "ἀπολέσεις τὸν πιστόν, τὸν αἰδήμονα, τὸν κόσμιον. τούτων ἄλλας βλάβας μείζονας μὴ ζήτει."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a angl. G. Long; zkráceno: τὸν κόσμιον v převodu chybí, αἰδήμων je ten, kdo má stud a cit pro to, co se nedělá"
    zdroj: epiktetos-rozpravy-nejhorsi
  - id: rozpravy-i-1-31
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 1, 31
    cesky: "To znamená mít nacvičeno, co je třeba nacvičit."
    original: "τοῦτʼ ἔστι μεμελετηκέναι ἃ δεῖ μελετᾶν"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a angl. G. Long"
    zdroj: epiktetos-rozpravy-nejhorsi
  - id: rukojet-3-hrnek
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "3"
    cesky: "U všeho, co máš rád, si připomeň, jaké to je, a začni od nejmenších věcí. Máš-li rád hrnek, řekni si: Mám rád hrnek. Když se rozbije, nerozruší tě to."
    original: "ἐφʼ ἑκάστου τῶν ψυχαγωγούντων … ἀπὸ τῶν σμικροτάτων ἀρξάμενος· ἂν χύτραν στέργῃς, ὅτι χύτραν στέργω. κατεαγείσης γὰρ αὐτῆς οὐ ταραχθήσῃ·"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a angl. G. Long; kratší podoba bez pokračování o dítěti a ženě (to jen učiteli)"
    zdroj: epiktetos-rukojet
  - id: seneca-ep-24-12
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 12
    cesky: "Doufej v to nejspravedlivější a připrav se na to nejnespravedlivější."
    original: "et quod aequissimum est spera, et ad id te quod est iniquissimum conpara"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); jde o rozsudek, proto „spravedlivý“"
    zdroj: seneca-epistulae-nejhorsi
  - id: seneca-ep-24-13
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 13
    cesky: "Nejen lidem, ale i věcem je třeba strhnout masku a vrátit jim jejich tvář."
    original: "Non hominibus tantum, sed rebus persona demenda est et reddenda facies sua."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-nejhorsi
  - id: seneca-ep-13-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 13, 4
    cesky: "Víc věcí nás straší, než nás tíží, a častěji trpíme představou než skutečností."
    original: "Plura sunt, Lucili, quae nos terrent, quam quae premunt, et saepius opinione quam re laboramus."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); oslovení „Lucili“ v převodu chybí"
    zdroj: seneca-epistulae-nejhorsi
  - id: seneca-ep-91-3
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 91, 3
    cesky: "Nečekané tíží víc; novost přidává neštěstí váhu."
    original: "inexpectata plus adgravant; novitas adicit calamitatibus pondus"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-nejhorsi
  - id: menoikeus-127
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 127 (Diogenés Laertios X, 127)
    cesky: "Pamatuj, že budoucnost není ani úplně naše, ani úplně ne naše: abychom na ni nečekali, jako by určitě přišla, ani nezoufali, jako by určitě nepřišla."
    original: "Μνημονευτέον δὲ ὡς τὸ μέλλον οὔτε ἡμέτερον οὔτε πάντως οὐχ ἡμέτερον, ἵνα μήτε πάντως προσμένωμεν ὡς ἐσόμενον μήτε ἀπελπίζωμεν ὡς πάντως οὐκ ἐσόμενον."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-122

