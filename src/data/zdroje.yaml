  - { id: iep-chrysippus, druh: encyklopedie, nazev: "Chrysippus", autor: "Jeremy Kirby", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/chrysippus/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M1), četl jsem text hesla: narozen v Soloi (dnes u Mersinu), žil asi 280 až 207 př. n. l., zemřel ve 143. olympiádě ve 73 letech; žák Kleanthův; po letech výuky mimo školu ji roku 230 př. n. l. převzal po Kleanthovi." }
  - { id: iep-cicero, druh: encyklopedie, nazev: "Marcus Tullius Cicero", autor: "Edward Clayton", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/cicero/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: narozen 3. 1. 106, zavražděn 7. 12. 43 př. n. l.; konzul roku 63; filozofické spisy psal podle Platónových a Aristotelových dialogů; po celý život se hlásil k Akademii; překládal řecké spisy do latiny; k epikurejcům choval téměř celý život pohrdání a v O přirozenosti bohů jejich názor líčí a vyvrací." }
  - { id: iep-musonius, druh: encyklopedie, nazev: "Musonius Rufus", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/musonius/", overeno: 2026-10-17, poznamka: "17. 10. 2026 (medailonky M2), správná adresa hesla je iep.utm.edu/musonius/ (dřívější adresa vedla na neexistující stránku): narozen před rokem 30 n. l. ve Volsiniích jako římský rytíř; roku 60 s Rubelliem Plautem do Malé Asie; po Pisonově spiknutí roku 65 poslán Néronem na Gyaros; zpět za Galby 68; podruhé vyhnán Vespasianem, vrátil se za Tita; zemřel před 101–102. Nic nenapsal, nauka se zachovala ve 32 výrocích a 21 delších rozpravách; filozofii pojímal jako cvičení v ušlechtilém jednání a chtěl stejné vzdělání ve filozofii pro ženy i muže; největší žák Epiktétos." }

