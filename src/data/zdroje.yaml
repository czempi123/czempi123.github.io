prameny:
  # Stanford Encyclopedia of Philosophy
  - { id: sep-socrates, druh: encyklopedie, nazev: "Socrates", autor: "Debra Nails, S. Sara Monoson", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/socrates/", overeno: 2026-09-29, poznamka: "Oddíl 3: chronologie (469–399, Potidaia 432, Délion 424, Amfipolis 422, Oblaka 423, proces 399). 17. 10. 2026 (medailonky M2), znovu četl jsem text hesla: Potidaia 432, Sókratés zachránil raněného Alkibiada (Symposion 220d–e); Délion 424; Alkibiadés přesvědčil shromáždění k výpravě na Sicílii; Aristofanés (±450–±386) a jeho Oblaka; Xenofón (±425–±386) je jeden ze tří hlavních pramenů o Sókratovi (Vzpomínky na Sókrata, Hospodář)." }
  - { id: sep-plato, druh: encyklopedie, nazev: "Plato", autor: "Richard Kraut", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/plato/", overeno: 2026-09-29, poznamka: "Uvádí 429?–347; učitel Sókratés, žák Aristotelés, Syrákúsy. 3. 10. 2026 (rev. 24. 4. 2026): pravost listů není všeobecně přijímána a mnohé nebo většina skoro jistě Platónovy nejsou; o Sedmém listu mluví jako o tom, co říká „autor sedmého listu“; rané dialogy uchovávají památku Sókrata, v pozdějších se „Sókratés“ od historického vzdaluje." }
  - { id: sep-aristotle-ethics, druh: encyklopedie, nazev: "Aristotle's Ethics", autor: "Richard Kraut", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle-ethics/", overeno: 2026-10-05, poznamka: "Nauka o středu (EN 1106a26–b28). 5. 10. 2026 (celek 5, četl nástroj WebFetch): ctnost povahy je sklon vzniklý zvykem (hexis); Aristotelés nenabízí rozhodovací postup a tvrdí, že to žádná etická teorie neumí; některé city a činy jsou špatné vždy; akrasia má dva druhy, zbrklost a slabost; v jejím výkladu se Aristotelés kupodivu drží blízko Sókrata." }
  - { id: sep-aristotle, druh: encyklopedie, nazev: "Aristotle", autor: "Christopher Shields", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle/", overeno: 2026-10-05, poznamka: "Rev. 25. 8. 2020. Oddíl Life: Stageira 384, Akademie asi od sedmnácti do Platónovy smrti 347, Assos asi tři roky, Lesbos další dva roky s Theofrastem, sňatek s Pýthiadou, Hermeiovou neteří; roku 343 na Filipovu žádost do Pelly učit třináctiletého Alexandra; výuka trvala spíš jen dva nebo tři roky a ví se o ní málo; 335 návrat do Athén a škola v Lykeiu; jméno peripatetiků asi od krytého ochozu (peripatos); Herpyllis a syn Níkomachos; 323 odchod do Chalkidy, výrok o druhém hříchu proti filozofii jako často opakované vyprávění; zemřel 322 přirozenou smrtí. Oddíl o díle: snad až dvě stě spisů, dochováno asi 31; dialogy ztraceny; Cicero o zlaté řece; dochované texty jsou nejspíš zápisky k přednáškám. 5. 10. 2026 četl stránku nástroj WebFetch." }
  - { id: sep-pythagoras, druh: encyklopedie, nazev: "Pythagoras", autor: "Carl Huffman", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/pythagoras/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: asi 570–490 př. n. l.; mládí na Samu, kolem 530 do Krotónu, zemřel v Metapontu kolem 490; sám nic nenapsal; kolem 510 násilí proti pýthagorejcům v Krotónu; Xenofanés se mu vysmívá (příběh o štěněti)." }
  - { id: sep-heraclitus, druh: encyklopedie, nazev: "Heraclitus", autor: "Daniel W. Graham", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/heraclitus/", overeno: 2026-09-29, poznamka: "9. 10. 2026 (celek 7), četl nástroj WebFetch (rev. 8. 12. 2023): působil kolem roku 500 př. n. l.; o životě se ví málo, většina dochovaných historek byla zjevně vymyšlena, aby ilustrovala jeho povahu; podle jedné zprávy zdědil čestný úřad „krále“ Iónů a přenechal ho bratrovi; „říká se“, že napsal jedinou knihu a uložil ji v Artemidině chrámu. Ze tří znění o řece (B12, B49a, B91) je podle hesla jediným pravým B12; B49a mu odporuje, B91 je parafráze; Platón mohl své čtení převzít z Kratylovy kritiky. Řeka zůstává tím, čím je, právě tím, že mění, co obsahuje. „Možná podnítil“ Parmenida k opačné filozofii (Patin 1899, Graham 2002), ač mají víc společného, než se uznává (Nehamas 2002). Spojení „panta rhei“ heslo nemá." }
  - { id: sep-parmenides, druh: encyklopedie, nazev: "Parmenides", autor: "John Palmer", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/parmenides/", overeno: 2026-09-29, poznamka: "9. 10. 2026 (celek 7), četl nástroj WebFetch (rev. 4. 3. 2025; konec hesla, asi dvacetina textu, nepřečten): z Platónova Parmenida (asi pětašedesátiletý Parmenidés, velmi mladý Sókratés) lze vyvodit narození kolem roku 515 př. n. l.; návštěvu Athén heslo nazývá smyšlenou; báseň v hexametrech, dochováno asi 160 veršů z možná 800; z kosmologie snad desetina. Výklady: přísný monismus (svět zkušenosti neexistuje; Guthrie), dialektický (Owen: kosmologie je jen dialektický prostředek), „predikační“ (Mourelatos, Curd: jsoucen může být víc), „modální“ (věcí, které jsou, je nespočet; kosmologie je Parmenidův vlastní nejlepší výklad proměnlivého světa). Mnozí vykladači odmítají, že by popíral existenci světa, který zakoušíme; proč kosmologii napsal, zůstává podle Kirka, Ravena a Schofielda záhadou. Že reagoval na Hérakleita, heslo netvrdí." }
  - { id: sep-zeno-elea, druh: encyklopedie, nazev: "Zeno of Elea", autor: "John Palmer", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/zeno-elea/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M2), četl jsem text hesla (rev. 12. 5. 2025): narozen asi 490 př. n. l. (podle Platónova Parmenida je Zénón skoro čtyřicetiletý, Parmenidés asi pětašedesátiletý a Sókratés velmi mladý), činný v Magna Graecia v polovině 5. století; jinak o životě skoro nic věrohodného (D. L. IX, 25–29); tvrzení, že hájil Parmenida, stojí podle hesla na Platónovi a jeho svědectví ho nakonec nepodporuje. Rok smrti heslo neuvádí." }
  - { id: sep-democritus, druh: encyklopedie, nazev: "Democritus", autor: "Sylvia Berryman", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/democritus/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M1), četl jsem text hesla: narozen asi 460 př. n. l., občan Abdér (někdy se uvádí Milétos); Leukippos jeho společník nebo učitel; anekdoty o jeho životě mají nejistou věrohodnost." }
  - { id: sep-xenophanes, druh: encyklopedie, nazev: "Xenophanes", autor: "James Lesher", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/xenophanes/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M2), četl jsem text hesla (rev. 19. 5. 2023): podle Diogena Laertia narozen v Kolofónu, vrchol života v 60. olympiádě (540–537 př. n. l.), po vyhnání z rodného města se připojil ke kolonii v Elei; sám říká, že od pětadvaceti let 67 let putoval řeckým světem. Učitelem Parmenidovým a zakladatelem eleatské školy ho nazývají až pozdější autoři, ze zlomků se jednoduchému zařazení vymyká. Roky narození a smrti heslo neuvádí; v atlasu pocházejí z Britannicy (záhlaví)." }
  - { id: sep-empedocles, druh: encyklopedie, nazev: "Empedocles", autor: "Richard Parry", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/empedocles/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: rodák z Akragantu; přesná data neznámá, narozen na počátku 5. století, zemřel podle Aristotela v šedesáti; Gorgiás je uváděn jako jeho žák (A 1 = P 24); Lucretius ho v De rerum natura chválí, ne bez výhrad." }
  - { id: sep-anaxagoras, druh: encyklopedie, nazev: "Anaxagoras", autor: "Patricia Curd", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/anaxagoras/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla (rev. 9. 8. 2026): rodák z Klazomen, narozen kolem 500 (podle D. L. mu bylo dvacet, když Xerxés překročil Hellespont); v Athénách dvacet až třicet let, přítel a chráněnec Perikla; obžalován z bezbožnosti, mj. kvůli tvrzení, že Slunce je rozžhavený kámen; odchod z Athén mezi 436 a 430 (datování sporné), zemřel 428 v Lampsaku; jeho kniha se podle Platónovy Obrany dala koupit za drachmu." }
  - { id: sep-confucius, druh: encyklopedie, nazev: "Confucius", autor: "Mark Csikszentmihalyi", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/confucius/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: tradičně 551–479 př. n. l.; narozen ve státě Zou v dnešním Šan-tungu, jižně od většího státu Lu; úřednická kariéra v Lu a učení (podle tradice 72 až 77 žáků)." }
  - { id: sep-archytas, druh: encyklopedie, nazev: "Archytas", autor: "Carl Huffman", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/archytas/", overeno: 2026-09-29, poznamka: "Narozen 435–410, zemřel 360–350; záchrana Platóna 361. 17. 10. 2026 (medailonky M2), četl jsem text hesla: v Tarentu sedmkrát po sobě zvolený stratég (výjimka ze zákazu zvolení dva roky po sobě), první vyřešil zdvojení krychle; jediný znatelný žák je Eudoxos (geometrie, podle D. L. VIII, 86), jehož roky heslo klade na ca. 390–340 (MacTutor 408–355)." }
  - { id: sep-speusippus, druh: encyklopedie, nazev: "Speusippus", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/speusippus/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M2), četl jsem text hesla (rev. 29. 8. 2024): syn Platónovy sestry Potóné, po Platónově smrti 348/347 vedl Akademii osm let, patrně do své smrti (kolem 340/339); narození odhadem kolem roku 410." }
  - { id: sep-xenocrates, druh: encyklopedie, nazev: "Xenocrates", autor: "Russell Dancy, Giulia De Cesaris", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/xenocrates/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M1), četl jsem text hesla (rev. 3. 9. 2025): z Chalkédonu; po Speusippově smrti roku 339/338 v čele Akademie, 25 let, zemřel v 82 letech; životní data 396/395 až 314/313; s Aristotelem možná na pozvání Hermeia z Atarnea opustil Athény." }
  - { id: sep-theophrastus, druh: encyklopedie, nazev: "Theophrastus", autor: "Katerina Ierodiakonou", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/theophrastus/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M2), četl jsem text hesla: narozen v Eresu na Lesbu kolem 371 (D. L. V, 36–38), zemřel kolem 287; po Platónově smrti s Aristotelem do Assu, na Lesbos a do Makedonie, kolem 335 zpět do Athén; po Aristotelově odchodu roku 323 vedl Peripatos pětatřicet let; spis Povahy: třicet krátkých, často humorných náčrtů záporných typů z všedního života Athén; dvě velká botanická pojednání (Zkoumání rostlin, Příčiny rostlin)." }
  - { id: sep-cyrenaics, druh: encyklopedie, nazev: "The Cyrenaics", autor: "Voula Tsouna", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/cyrenaics/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M2), četl jsem text hesla (1. vydání 31. 3. 2026): Aristippos, syn Aritadův, rodák z Kyrény, narozen kolem 435; v rané dospělosti přišel do Athén ke Sókratovu kruhu, po jeho smrti učil za poplatek, navštívil dvůr Dionýsia v Syrákúsách a založil vlastní školu; jeho hlavní činnost v Athénách, Kyréně, Syrákúsách a jinde je kladena mezi 399 a asi 355. Datum úmrtí heslo neuvádí, rok 355 v atlasu je konec doby činnosti. Slast stála ve středu jeho myšlení i života." }
  - { id: sep-epicurus, druh: encyklopedie, nazev: "Epicurus", autor: "David Konstan", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/epicurus/", overeno: 2026-09-29, poznamka: "8. 10. 2026 (celek 6), četl nástroj WebFetch (rev. 8. 7. 2022): zemřel roku 270 př. n. l. v 70 nebo 71 letech; atomismus zdědil především od Démokrita." }
  - { id: sep-seneca, druh: encyklopedie, nazev: "Seneca", autor: "Katja Vogt", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/seneca/", overeno: 2026-09-29, poznamka: "8. 10. 2026 (celek 6), četl nástroj WebFetch (rev. 13. 2. 2024): narozen asi 1 př. n. l.; v dopisech si buduje literární postavu, spisy nejsou autobiografie; Útěcha Marcii je nejspíš nejstarší dochovaný spis, útěchy Helvii a Polybiovi snad z let 43–44; O mírnosti z roku 55 nebo 56." }
  - { id: sep-epictetus, druh: encyklopedie, nazev: "Epictetus", autor: "Margaret Graver", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/epictetus/", overeno: 2026-10-02, poznamka: "Narozen v 50. letech v Hierapoli; otrok Epafrodita; kdy přišel do Říma, se neví; žák Musonia Rufa; vykázán nejspíš ediktem roku 89 (SEP „Stoicism“ uvádí 93); škola v Níkopoli, zemřel kolem 135; kulhání připisováno artritidě, nebo týrání v otroctví; neoženil se, ve stáří se ujal dítěte. Oddíly 4.3–4.6: vůle, hodnota, city, vztahy." }
  - { id: sep-marcus-aurelius, druh: encyklopedie, nazev: "Marcus Aurelius", autor: "Rachana Kamtekar", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/marcus-aurelius/", overeno: 2026-10-02, poznamka: "Narozen 121, císařem 161–180; útoky Germánů, vzpoury, mor; Hovory aspoň zčásti z posledních let tažení; události svého života popisuje tak, že je nelze poznat; učitelé Fronto, Rusticus, Apollónios, Sextos; Epiktétovy zápisky (I, 7)." }
  - { id: sep-stoicism, druh: encyklopedie, nazev: "Stoicism", autor: "Dirk Baltzly", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/stoicism/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M1), četl jsem text hesla (oddíl 4.1): Zénón vyjádřil cíl života jako „žít v souladu“, tedy podle jednoho souladného rozumu, protože ti, kdo žijí v rozporu, jsou nešťastní; Kleanthés přidal „s přírodou“." }
  - { id: sep-pyrrho, druh: encyklopedie, nazev: "Pyrrho", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/pyrrho/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla (rev. 15. 9. 2022): žil asi 365–360 až 275–270 př. n. l., rodák z Élidy; nejspolehlivější je jeho spojení s Anaxarchem z Abdér; cesta s Alexandrem do Indie je jen údajná; sám nic nenapsal." }
  - { id: sep-lucretius, druh: encyklopedie, nazev: "Lucretius", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/lucretius/", overeno: 2026-09-29, poznamka: "8. 10. 2026 (celek 6), četl nástroj WebFetch (heslo S. Trépaniera, 2023): žil od poloviny 90. do poloviny 50. let př. n. l.; o životě se neví skoro nic; Hieronymova historka o nápoji lásky a šílenství je nevěrohodná." }
  - { id: sep-plotinus, druh: encyklopedie, nazev: "Plotinus", autor: "Paul Kalligas", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/plotinus/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: rodák z Egypta, narozen asi 204 (vyvozeno z Porfyria); ve dvaceti osmi letech přišel k Ammoniovi Sakkovi do Alexandrie, 243 šel s tažením Gordiána III., od konce 244 v Římě, učil přes pětadvacet let do smrti 270; Platónova postava ovládá jeho myšlení a je hlavním zdrojem inspirace." }
  - { id: sep-carneades, druh: encyklopedie, nazev: "Carneades", autor: "James Allen", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/carneades/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: 214–129/8 př. n. l., rodák z Kyrény, studoval v Athénách, scholarchou Akademie před rokem 155, tehdy vyslán do Říma; dvě římské přednášky o spravedlnosti jsou jen tradice (pozdní prameny, pochybnosti); Cicerův spis O státě III může zachovat stopy jeho řeči proti spravedlnosti." }
  - { id: sep-philo, druh: encyklopedie, nazev: "Philo of Alexandria", autor: "Carlos Lévy", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/philo/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: žil v Alexandrii, účastnil se vyslanectví k Caligulovi po nepokojích roku 38; velmi obdivoval Platóna, Timaios je v jeho spisu O stvoření světa „masivně“ přítomen (Runia 2001). Heslo píše o první polovině 1. století př. n. l., nejspíš překlep; roky v atlasu jsou z Britannicy." }
  - { id: sep-protagoras, druh: encyklopedie, nazev: "Protagoras", autor: "Mauro Bonazzi", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/protagoras/", overeno: 2026-10-01, poznamka: "Abdéra, asi 490 – asi 420 (Menón 91e), nejméně dvě návštěvy Athén, Thurioi 444 z pověření Perikla; proces, pálení knih a utonutí „velmi pochybné“; B1, B4 (delší znění podle Eusebia), velká řeč 320c–322d." }
  - { id: sep-sophists, druh: encyklopedie, nazev: "The Sophists", autor: "Mi-Kyoung Lee, C. C. W. Taylor", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/sophists/", overeno: 2026-10-01, poznamka: "Úvod: profesionální učitelé, kteří cestovali po řeckém světě a učili hlavně umění veřejně mluvit a úspěšně vést život." }

  # Internet Encyclopedia of Philosophy
  - { id: iep-thales, druh: encyklopedie, nazev: "Thales of Miletus", autor: "Patricia O'Grady", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/thales/", overeno: 2026-09-29, poznamka: "Studna (Platón, Theaitétos 174a), lisy na olivy (Aristotelés, Politika 1259a), Anaximandros jako jeho žák. 17. 10. 2026 (medailonky M3), četl jsem text hesla: c. 620 – c. 546 př. n. l., rodák z Milétu; Aristotelés ho pokládá za zakladatele nového způsobu hledání počátků; Anaximandros je podle D. L. I, 13 jeho žák." }
  - { id: iep-anaximander, druh: encyklopedie, nazev: "Anaximander", autor: "Dirk L. Couprie", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/anaximander/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: c. 610–546 př. n. l., rodák z Milétu, krajan Thalétův (podle hesla asi o deset let mladší); první, kdo napsal řecký filozofický spis prózou (O přírodě); počátek všeho je neomezené (apeiron); první mapa světa se mu jen připisuje." }
  - { id: iep-anaximenes, druh: encyklopedie, nazev: "Anaximenes", autor: "Daniel W. Graham", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/anaximenes/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: činný v polovině 6. století, zemřel asi 528; třetí filozof milétské školy; Theofrastos ho označuje za druha a možná žáka Anaximandra; počátek všeho je vzduch, látky se mění zřeďováním a zhušťováním. Heslo narození neuvádí (IEP o Thalétovi uvádí narození 585 podle D. L., nepřevzato)." }
  - { id: iep-protagoras, druh: encyklopedie, nazev: "Protagoras", autor: "Carol Poster", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/protagor/", overeno: 2026-09-29 }
  - { id: iep-gorgias, druh: encyklopedie, nazev: "Gorgias", autor: "C. Francis Higgins", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/gorgias/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M3), četl jsem text hesla: 483–375 př. n. l., z Leontín; roku 427 vyslancem v Athénách; zemřel ve věku 108 let v Larise; žák Empedoklův a podle Quintiliana a jiných učitel Isokratův; možná učil i Aspasii." }
  - { id: iep-antisthenes, druh: encyklopedie, nazev: "Antisthenes", autor: "Julie Piering", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/antisthenes/", overeno: 2026-09-29, poznamka: "17. 10. 2026 (medailonky M1), četl jsem text hesla: asi 446 až 366 př. n. l.; otec Athéňan, matka Thrákyně, nothos, tedy bez athénského občanství; nejdřív žák Gorgia, potom Sókratův přítel, podle Platóna byl při jeho smrti; učitel Diogena a podle Diogena Laertia první kynik." }
