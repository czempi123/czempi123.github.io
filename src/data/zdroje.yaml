  # Primární texty
  - { id: platon-obrana, druh: pramen, nazev: "Obrana Sókratova", autor: Platón, dilo: "Apology, angl. B. Jowett (Project Gutenberg 1656)", url: "https://www.gutenberg.org/files/1656/1656-h/1656-h.htm", overeno: 2026-10-01, poznamka: "20e–23b věštba a zkoušení moudrých (21a Chairefón, 21d politik), 23c mladí ho napodobují, 24b–c obžaloba, 28e Potidaia, Amfipolis, Délion, 33d Kritón, 36a třicet hlasů, 36b–37a prytaneum, 37c–38a proč ne vyhnanství, 38a nezkoumaný život, 38b třicet min a ručitelé. 1. 10. 2026 ověřeno i v řeckém textu (Burnet) a překladu H. N. Fowlera (PerseusDL, tlg0059.tlg002). 3. 10. 2026 (celek 4): 34a Adeimantos, jehož bratr Platón je u soudu přítomen. 8. 10. 2026 (celek 6): bát se smrti je zdát se moudrým a nebýt (29a–b); dvě možnosti, co je smrt, s výhradou „jsou-li ty řeči pravdivé“ (40c–41c); dobrému se nemůže stát nic zlého (41d); prosba o syny (41e); poslední věta (42a). 17. 10. 2026 (medailonky M1) znovu čteno v Gutenbergu: 21a Chairefón byl Sókratovi dávným přítelem, prudký ve všem, co dělal, sdílel nedávný exil lidu a vrátil se s ním; 33d Kritón je stejného věku a stejné démy jako Sókratés." }
  - { id: platon-kriton, druh: pramen, nazev: "Kritón", autor: Platón, dilo: "Crito, angl. B. Jowett (Project Gutenberg 1657)", url: "https://www.gutenberg.org/files/1657/1657-h/1657-h.htm", overeno: 2026-10-01, poznamka: "Kritón u spícího Sókrata (43a–b); přemlouvá k útěku (44b–46a); neoplácet křivdu křivdou (49a–e); řeč Zákonů (50a–54d); z Athén vycházel jen do války a jednou na Isthmus (52b); u soudu mohl navrhnout vyhnanství (52c); sedmdesát let (52e). 1. 10. 2026 ověřeno i v řeckém textu a překladu H. N. Fowlera (PerseusDL, tlg0059.tlg003)." }
  - { id: platon-faidon, druh: pramen, nazev: "Faidón", autor: Platón, dilo: "Phaedo, angl. B. Jowett (Project Gutenberg 1658)", url: "https://www.gutenberg.org/files/1658/1658-h/1658-h.htm", overeno: 2026-10-01, poznamka: "Loď na Délos (58a–c); Platón byl nemocný (59b); Xanthippa (60a); rozloučení, žalářník (116b–d); poslední den a smrt (116e–118a), kohout pro Asklépia (118a); Kritón je přítomen. 1. 10. 2026 ověřeno i v řeckém textu a překladu H. N. Fowlera (PerseusDL, tlg0059.tlg004). 17. 10. 2026 (medailonky M1) znovu čteno: 59b mezi přítomnými Kritón a Antisthenés; 118a Kritón zavřel Sókratovi oči a ústa. 17. 10. 2026 (medailonky M3), Jowett, 97b–99d (Gutenberg): Sókratés vypráví, že slyšel číst z knihy Anaxagorovy, že vše řídí rozum (nús), potěšilo ho to, sáhl po knihách a četl je; zklamalo ho, že Anaxagorás rozum při výkladu příčin nepoužívá." }
  - { id: platon-symposion, druh: pramen, nazev: "Symposion", autor: Platón, dilo: "Symposium, angl. B. Jowett (Project Gutenberg 1600)", url: "https://www.gutenberg.org/files/1600/1600-h/1600-h.htm", overeno: 2026-10-01, poznamka: "Asklépios jako praotec a zakladatel lékařství (186e, mluví Eryximachos). Alkibiadés o Sókratovi u Potidaie (219e–220e: hlad, mráz, stání do úsvitu, záchrana Alkibiada) a při ústupu od Délia (221a–c, s citátem z Aristofanových Oblak 362; klidné nikdo nenapadá, pronásledují ty, kdo prchají bez hlavy, 221b–c). 1. 10. 2026 ověřeno i v řeckém textu a překladu W. R. M. Lamba (PerseusDL, tlg0059.tlg011). 17. 10. 2026 (medailonky M2), Alkibiadés o ústupu od Délia (221a): byl na koni, tedy poměrně z dosahu nebezpečí, potkal ustupujícího Sókrata s Lachétem a slíbil, že s nimi zůstane; Sókratés ustupoval klidně a nikdo se ho neodvážil napadnout. Ochranu Sókrata Alkibiadem proto atlas netvrdí." }
