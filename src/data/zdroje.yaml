    autor: Platón
    dilo: Ústava
    misto: V, 473c–d
    cesky: "Dokud se v obcích nestanou králi filozofové, nebo dokud ti, kterým se dnes říká králové a vládci, nezačnou opravdu a náležitě filozofovat, nebude konec zlu v obcích, a myslím, že ani v lidském rodě."
    original: "ἐὰν μή … ἢ οἱ φιλόσοφοι βασιλεύσωσιν ἐν ταῖς πόλεσιν ἢ οἱ βασιλῆς τε νῦν λεγόμενοι καὶ δυνάσται φιλοσοφήσωσι γνησίως τε καὶ ἱκανῶς … οὐκ ἔστι κακῶν παῦλα … ταῖς πόλεσι, δοκῶ δʼ οὐδὲ τῷ ἀνθρωπίνῳ γένει"
