  - { id: platon-laches, druh: pramen, nazev: "Lachés", autor: Platón, dilo: "Laches, řecky J. Burnet, angl. W. R. M. Lamb (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg019/tlg0059.tlg019.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Lachés chválí Sókrata za ústup od Délia (181a–b); odvaha = zůstat v řadě (190e); Skythové a Plataje (191a–c); odvaha ve všem (191d–e); vytrvalost duše a rozumná vytrvalost (192b–193c); Nikiás: vědění, čeho se bát (194d–195a), domyšleno celá ctnost (199c–e); nenašli, co je odvaha (199e)." }
