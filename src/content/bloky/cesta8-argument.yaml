# Slož argument v cestě 8, krok 3. Epikúrův argument z Dopisu Menoikeovi 124 (Diogenés Laertios X, 124),
# ověřený proti řeckému textu (Hicks, PerseusDL) 30. 10. 2026. Skrytý předpoklad Epikúros v dopise neříká;
# říká ho v Dopise Hérodotovi (D. L. X, 65–66), Lucretius ho uvádí jako důvod (O přírodě III, 830–831).
# Podklady celku 6, oddíl Jádro: Epikúros › Slož argument v kroku 3.
# Karty stojí v pořadí, jak jsou tady; nepiš je v pořadí argumentu.
druh: argument
obdobi: 2
scena: "Epikúrova rada má tři věty: dva důvody a to, co z nich plyne. Tady leží rozházené."
otazka: Jak z nich Epikúros složil argument?
karty:
  - id: ztrata
    text: Smrt je ztráta vnímání.
    misto: 2
    vZaveru: "V dopise stojí tahle věta poslední, a proto vypadá jako závěr. Patří ale k větě se slovem „totiž“ a spolu s ní říká, proč se nás smrt netýká. Co tedy z obou plyne?"
    kdyzNapadnes: "Míříš na druhý důvod. Že mrtvé tělo nevnímá, uzná skoro každý, i ten, kdo věří, že duše žije dál. Napadáš opravdu tuhle větu, nebo tu, která v argumentu chybí?"
  - id: netyka
    text: Smrt se nás netýká.
    misto: zaver
  - id: vnimani
    text: Všechno dobré i zlé je ve vnímání.
    misto: 1
    kdyzNapadnes: "Tuhle větu napadneš, i když s Epikúrem souhlasíš, že po smrti nic není. Co by pro tebe bylo zlé, i kdyby ses o tom nikdy nedozvěděl?"
skryty:
  text: Po smrti z nás nezbude nic, co by mohlo vnímat.
  zpetna: "Tuhle větu argument potřebuje a v dopise ji Epikúros neříká. Že smrt bere vnímání, by přijal i ten, kdo věří, že duše žije dál: tělo přece cítit přestane. Závěr ale platí, jen když po smrti nezbude nic, co by vnímalo jinak."
  kdyzNapadnes: "Míříš na větu, kterou Epikúros v dopise nenapsal a bez které argument nestojí. Tady s ním nesouhlasí každý, kdo věří, že po smrti něco je. Jde ti o to, jestli je argument dobře složený, nebo jestli je pravda, co předpokládá?"
napadnout:
  karta: vnimani
  proc: "Věta o vnímání je první důvod a říká, že zlé může být jen to, co někdo zakouší. Kdo s ní nesouhlasí, nepotřebuje k tomu víru v nic po smrti. Stačí mu jediný případ, kdy je pro člověka něco zlé, i když to nikdy nepocítí."
zpetna: "Závěr z obou důvodů plyne, ale ne sám od sebe. Druhý důvod říká, že smrt bere vnímání. Kolik toho bere, už neříká. Přidal bys k argumentu větu, kterou k tomu potřebuje?"
zadnou: "Argument ti drží, i s větou, kterou Epikúros v dopise nenapsal. Stačí to, aby zmizel strach, nebo něco zůstane? A na který koš z druhého kroku by mířilo to, co zůstane?"
zdroje: [dl-x-122, dl-x-63]
