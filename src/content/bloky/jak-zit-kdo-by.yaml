# Kdo by to řekl? na stránce velké otázky Jak mám žít? (herna-v1, T; odpověď 1 v Co rozhodnout před P6). Stojí pod
# oddílem Proč to tak viděli (frontmatter `hra`), kde student hlasy na otázku už potkal. Věta 6 z podkladů
# docs/podklady/herna.md › 3. Revize R (O): v lístku Diogenés, hlas stránky, s odpovědí na posměch (D. L. VI, 58,
# ověřeno 21. 11. 2026); Antisthenés (D. L. VI, 8), kterého student na stránce nepotká, zůstal jen jako možnost.
# Odmítl by Aristotelés (EN IV, 9, 1128b16–20: stud se hodí k mladému věku); proc říká, že stud patří jen ke
# špatnému činu, který člověk udělal sám (1128b21–29), aby ho student, kterému se smějí, nečetl jako „máš se
# stydět“. Hipparchia je mezi razítky jako hlas stránky, který se na očekávání druhých neohlížel; její citát stojí
# na stránce, a tak ho atlas v lístku neopakuje.
druh: kdo-by
obdobi: 2
otazka: "Komu z nich by ta věta mluvila z duše?"
veta: "Na tom, co si o tobě myslí ostatní, nezáleží."
odkud: sit
popisek: "Video influencera"
moznosti: [diogenes, antisthenes, hipparchia, aristoteles]
atlas:
  - osoba: diogenes
    citat: dl-vi-58-osli
    proc: "Podepsal by ji. Na posměch odpovídal po svém:"
odmitl:
  - osoba: aristoteles
    citat: etika-1128b
    proc: "Namítl by, že strach o dobré jméno drží mladé od chyb. Stud podle něj patří jen k tomu, co člověk sám udělal špatně:"
zdroje: [dl-vi-41, aristoteles-etika-stud]
