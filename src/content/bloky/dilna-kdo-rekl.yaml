# Kdo to řekl? v dílně (herna-v1, K1; K2: pointa a věty pod razítky): pět vět z podkladů docs/podklady/herna.md ›
# Kdo to řekl? (č. 1, 3, 7, 9, 12). Citáty jsou ze zdroje.yaml; správná je osoba citátu, „jini“ jsou ostatní možnosti.
# Pod razítky stojí první věta pole proc z lide.yaml. Démokritos (č. 5) z dílny vypadl: jeho věta proc citát opisuje
# („podle zvyku“, „atomy a prázdno“), takže by se hádalo podle stejných slov (src/lib/herna/citaty.ts › prozrazuje).
druh: kdo-rekl
obdobi: 1
otazka: "Čí je ta věta?"
karty:
  - citat: rukojet-5
    jini: [epikuros, aristoteles, diogenes]
    napoveda: "Komu z nich šlo o to, co máme ve své moci, a co ne?"
    pointa: "Neklid nevyvolá věc sama, ale soud, který si o ní uděláme, a ten je v našich rukou."
  - citat: obrana-38a
    jini: [epiktetos, epikuros, aristoteles]
    napoveda: "Hledej toho, kdo začínal přiznáním, že neví, a pak se vyptával ostatních."
    pointa: "Sókratés u soudu vysvětluje, proč s vyptáváním nepřestane, i kdyby ho to mělo stát život."
  - citat: parmenides-b8-ted
    jini: [herakleitos, demokritos]
    napoveda: "Komu z nich to, co skutečně je, nevzniká ani nezaniká?"
    pointa: "Co skutečně je, nemá minulost ani budoucnost: nevzniká, nezaniká a nemění se."
  - citat: politika-1253a
    jini: [diogenes, epikuros, protagoras]
    napoveda: "Hledej toho, kdo zkoumal, jak lidé žijí v obci, ne jak se bez ní obejít."
    pointa: "Dobře žít se podle Aristotela nedá o samotě: člověk k tomu potřebuje obec a druhé lidi."
  - citat: seneca-ep-28-1
    jini: [epikuros, aristoteles, diogenes]
    napoveda: "Hledej toho, kdo příteli v dopisech radil, co dělat s neklidem, který si člověk veze s sebou."
    pointa: "Cestováním se neklidu nezbavíš, protože si ho vezeš s sebou: změnit se musí mysl."
