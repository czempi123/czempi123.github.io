# Spor · cesta 1, krok 5: Prótagorás × Sókratés o měřítku pravdy, jak si ho představil Platón v Theaitétovi.
# Podklad: docs/podklady/celek-1-pravda.md › Spor Sókratés × Prótagorás. Rámec Theaitétos 164e–165a, 171c–d;
# Prótagorova strana 152a–b, 166d–167b a odpověď na sebevyvrácení (171a–d, výklad); Sókratova strana 178b–179b, 170e–171c.
# Na telefonu stojí Prótagorás nad Sókratem: jeho třetí argument proto začíná Sókratovou námitkou. Sókratův druhý
# argument jde až do konce 171a–c („true to nobody, neither to anyone else nor to him“), ne jen „musí jim to uznat“,
# které relativista s výhradou „pro ně“ uzná bez ztráty (zkouška skillů, sokrates-opravy, bod 2–3).
druh: spor
obdobi: 1
nadtitulek: Spor
scena: >-
  Platón si představil, jak se Sókratés o tu větu přel. V jeho dialogu je ale Prótagorás už mrtvý.
  Přítel, který ho znal, ho hájit nechce. Sókratés tedy hájí „sirotka“ sám.


  Na jednom místě přizná, že kdyby Prótagorás vystrčil hlavu ze země, nejspíš by je oba usvědčil z nesmyslů.
  Kdo z nich má pravdu, rozhodni sám.
otazka: Je pravda to, co se ti jeví?
strany:
  - osoba: protagoras
    postoj: Co se mi jeví, je pro mě pravda.
    argumenty:
      - >-
        Komu je ve větru zima, tomu je vítr studený. Komu zima není, tomu studený není.
        Nikdo z nich se nemýlí. Ptát se, jaký je vítr sám o sobě, nemá smysl.
      - >-
        Neznamená to, že jsou všichni stejně moudří. Moudrý nemění nepravdivé názory v pravdivé, protože nepravdivý názor neexistuje.
        Mění horší stav v lepší.


        Dělá to jako lékař: nemocnému chutná jídlo hořce a lékař ho nepřemlouvá, ale léčí. Učitel totéž dělá slovy.
      - >-
        Sókratés namítá, že Prótagorás musí dát za pravdu i těm, kdo si myslí, že se mýlí, a tím popírá sám sebe.
        Jenže to, že se mýlí, je pravda pro ně, ne pro něj.


        Kdo z jeho věty vynechá „pro toho, kdo ho má“, nevyvrací Prótagora, ale někoho jiného.
  - osoba: sokrates
    postoj: Ne každý názor obstojí.
    argumenty:
      - >-
        Jestli dostaneš zítra horečku, pozná lékař líp než ty. O víně rozhodne líp vinař, o hostině kuchař.
        A sám Prótagorás tvrdil, že líp než kdokoli ví, co zapůsobí u soudu. Aspoň o budoucnosti tedy není každý stejné měřítko.
      - >-
        Podle Prótagora je každý názor pravdivý pro toho, kdo ho má. Většina lidí si ale myslí, že se Prótagorás mýlí.
        Musí jim to tedy uznat: pravdivý je i názor, podle kterého se mýlí.


        Oni mu jeho větu neuznají, on jim jejich ano. Jeho Pravdu tak popírají všichni, nakonec i on sám.
        Není pravdou pro nikoho.
zdroje: [platon-theaitetos, sep-protagoras]
