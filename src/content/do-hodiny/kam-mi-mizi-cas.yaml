# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 34: krok 3 (spočítej si den), krok 5 (kdo rozhodl), krok 6 a 7 (Seneca radí Paulinovi odejít, Marcus odejít nemohl).
dvojice: "Ukažte si navzájem den, který jste spočítali ve třetím kroku. U každé položky se ptejte: Kdo o ní rozhodl?"
trida: "Seneca radil příteli odejít z úřadu, Marcus Aurelius odejít nemohl. Jak si vzít čas zpátky, když odejít nejde? Najděte tři způsoby."
