# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 33: Seneca (Dopisy 24) proti Epikúrovi podle Cicerona. Dvojice jen s drobnou obavou, bez nemoci a strachu o někoho (pouceni › Student, kterého se téma bolestně týká, stoicky-tyden R).
dvojice: "Každý vybere jednu drobnou věc, které se zítra trochu bojí, třeba písemku. Druhý se ptá: Co jde připravit předem, a co je už jen trápení?"
trida: "Seneca radil představit si to nejhorší a změřit ho. Epikúros podle Cicerona radil netrápit se dopředu. Najděte případ, kdy má pravdu jeden, a případ, kdy druhý."
