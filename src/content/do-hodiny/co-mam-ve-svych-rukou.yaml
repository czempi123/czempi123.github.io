# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 5: krok 3 (dvě půlky) a krok 7 (kamenná tvář, Rozpravy III, 2, 4). Otázka pro třídu nechává místo pro starost, u které klid na místě není.
dvojice: "Každý napíše jednu starost z tohoto týdne. Druhý ji rozdělí na dvě půlky: co je v rukou toho, kdo ji napsal, a co ne. Souhlasíte?"
trida: "Epiktétos nechtěl být bez citu jako socha. Čím se liší klid od lhostejnosti? Najděte situaci, ve které by klid nebyl na místě."
