# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 2: krok 1 a 4 (Théseova loď po prknech) a krok 7 (jak staré je tvoje tělo).
dvojice: "Každý napíše, co se za poslední tři roky změnilo a co zůstalo. Druhý se ptá: Co z toho musí zůstat, aby to byl pořád tentýž člověk?"
trida: "Théseova loď dostávala nová prkna, až v ní nezůstalo žádné staré. Je to pořád táž loď? Hlasujte a pak řekněte, co by váš hlas změnilo."
