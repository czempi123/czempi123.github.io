# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 4: krok 3 (Sókratés: kdo ví, udělá to), krok 4 (stavitelem stavěním, EN II, 1) a krok 7 (jak dlouho to trvá). Dvojice si nevyznává vlastní selhání, vybírá zvyk spolu (pouceni › Bloky).
dvojice: "Vyberte spolu jeden drobný zvyk, který by šel změnit, třeba chodit spát dřív. Co by podle Sókrata stačilo vědět a co by podle Aristotela chtělo cvik?"
trida: "Aristotelés říkal, že stavitelem se člověk stává stavěním. Jak dlouho podle vás trvá, než se z dobrého činu stane zvyk? Na čem to záleží?"
