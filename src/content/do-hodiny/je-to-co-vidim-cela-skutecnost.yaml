# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 3: krok 2 (odkud to vím) a krok 5 (Platón a Aristotelés). Jeskyně tu nikoho z třídy nestaví do role vězně (pouceni › celek 4).
dvojice: "Každý napíše jednu věc, kterou zná jen z obrazovky. Druhý se ptá: Jak by se dalo ověřit, že je skutečná?"
trida: "Platón hledal skutečnost za tím, co vidíme, Aristotelés v samotných věcech. Najděte jeden příklad, který by se hodil každému z nich."
