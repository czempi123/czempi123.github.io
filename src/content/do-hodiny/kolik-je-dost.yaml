# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 6: krok 3 (Epikúrova zkouška: bolí, když touhu nesplníš?) a krok 4 (kynici a Epikúros, každý z jiného důvodu).
dvojice: "Každý vybere jednu věc, po které teď touží. Druhý se ptá Epikúrovou otázkou: Bolelo by, kdyby to nevyšlo?"
trida: "Epikúros i kynici jedli chléb a pili vodu, ale každý z jiného důvodu. V čem se lišili? A který důvod je vám bližší?"
