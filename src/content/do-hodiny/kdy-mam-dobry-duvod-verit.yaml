# Karta Do hodiny k cestě 1 (herna-v1, K5). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Dvojice zkouší pravidlo z kroku 7 na protipříkladu (Sókratés hledal toho, kdo by
# věštbu vyvrátil); třída třídí jevy podle Prótagora z kroku 5 (Theaitétos 152a, citát theaitetos-152a v kroku).
dvojice: "Vyměňte si pravidla, která jste právě napsali. Každý zkusí najít případ, ve kterém by pravidlo toho druhého selhalo."
trida: "Prótagorás by řekl, že co se komu jeví, je pro něj pravda. Najděte spolu jednu věc, o které to platí, a jednu, o které ne. Čím se liší?"
