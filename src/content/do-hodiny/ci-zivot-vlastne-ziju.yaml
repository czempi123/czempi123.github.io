# Karta Do hodiny k cestě (herna-v1, T). Lístek pro učitele na konci posledního kroku: student ho vidí
# jen při promítání hodiny. Cesta 7: krok 4 (zvyky) a krok 5 (Sókratés a Antisthenův plášť, D. L. VI, 8). Výtka předvádění je zúžená na to, kvůli čemu padla (pouceni › Prameny a formulace).
dvojice: "Každý napíše jednu věc, kterou dělá hlavně kvůli tomu, co čekají druzí. Druhý se ptá: Co by se stalo, kdyby to skončilo?"
trida: "Sókratés řekl Antisthenovi, že skrz jeho plášť vidí touhu po slávě. Kdy je odmítání zvyků jen předvádění a kdy vlastní volba? Najděte příklad obojího."
